name: Weekly AI Signal Report

on:
  schedule:
    # 北京时间每周一 11:30（UTC 03:30），排在 10:45 日报之后。
    - cron: "30 3 * * 1"
  workflow_dispatch:
    inputs:
      force_send:
        description: "即使本周已发送也重新推送"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-ai-signal
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64, feishu-ai-signal]
    timeout-minutes: 45
    env:
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_BASE_ID: ${{ secrets.FEISHU_BASE_ID }}
      FEISHU_PARAM_TABLE_ID: ${{ secrets.FEISHU_PARAM_TABLE_ID }}
      FEISHU_ENTRY_TABLE_ID: ${{ secrets.FEISHU_ENTRY_TABLE_ID }}
      FEISHU_WEEKLY_TABLE_ID: ${{ secrets.FEISHU_WEEKLY_TABLE_ID }}
      FEISHU_WEEKLY_PENDING_TABLE_ID: ${{ secrets.FEISHU_WEEKLY_PENDING_TABLE_ID }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      PAPER_ENRICH_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Use prebuilt local Python environment
        run: |
          test -x /Users/batlap/Projects/feishu-ai-signal/.venv/bin/python
          echo "/Users/batlap/Projects/feishu-ai-signal/.venv/bin" >> "$GITHUB_PATH"

      - name: Verify dependencies
        run: python -m pip check

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Generate weekly report
        run: python -m src.weekly --output output/weekly-report.json

      - name: Export weekly site data
        run: python -m src.publish --weekly-input output/weekly-report.json

      - uses: actions/upload-artifact@v4
        with:
          name: generated-weekly-site
          path: site
          include-hidden-files: true
          retention-days: 1

  deploy-send:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_BASE_ID: ${{ secrets.FEISHU_BASE_ID }}
      FEISHU_WEEKLY_TABLE_ID: ${{ secrets.FEISHU_WEEKLY_TABLE_ID }}
      FEISHU_RECIPIENT_OPEN_ID: ${{ secrets.FEISHU_RECIPIENT_OPEN_ID }}
      FEISHU_RECIPIENT_OPEN_IDS: ${{ secrets.FEISHU_RECIPIENT_OPEN_IDS }}
      FEISHU_RECIPIENT_CHAT_IDS: ${{ secrets.FEISHU_RECIPIENT_CHAT_IDS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Replace site with generated artifact
        run: rm -rf site

      - uses: actions/download-artifact@v4
        with:
          name: generated-weekly-site
          path: site

      - name: Commit generated weekly data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site
          if git diff --cached --quiet; then
            echo "周报站点数据无变化，跳过提交"
          else
            git commit -m "chore(site): 发布 $(TZ=Asia/Shanghai date +%G-W%V) 周报数据 [skip ci]"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send Feishu weekly card
        env:
          PUBLIC_BASE_URL: ${{ steps.deployment.outputs.page_url }}
          FORCE_FLAG: ${{ inputs.force_send && '--force' || '' }}
        # notify 会轮询公网 weekly-Wxx.json，确认 Pages 已是本周周报才发卡片
        run: python -m src.notify --input site/data/weekly-latest.json $FORCE_FLAG
