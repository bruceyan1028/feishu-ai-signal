name: Daily AI Signal Brief

on:
  schedule:
    # 北京时间每天 09:00（UTC 01:00）。GitHub 定时有延迟，实际触发可能晚 10~30 分钟。
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      force_send:
        description: "即使今天已发送也重新推送"
        type: boolean
        default: false

permissions:
  # 生成的简报数据要回写仓库，否则只存在于本次 run 的 Pages 产物里
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-ai-signal
  cancel-in-progress: false

jobs:
  build-deploy-send:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # 所有步骤共享的配置：一处集中，避免各步骤漏传导致新库回退到旧库默认表 ID。
    env:
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_BASE_ID: ${{ secrets.FEISHU_BASE_ID }}
      FEISHU_SOURCE_TABLE_ID: ${{ secrets.FEISHU_SOURCE_TABLE_ID }}
      FEISHU_PARAM_TABLE_ID: ${{ secrets.FEISHU_PARAM_TABLE_ID }}
      FEISHU_ENTRY_TABLE_ID: ${{ secrets.FEISHU_ENTRY_TABLE_ID }}
      FEISHU_BRIEF_TABLE_ID: ${{ secrets.FEISHU_BRIEF_TABLE_ID }}
      FEISHU_PAPER_CONFIG_TABLE_ID: ${{ secrets.FEISHU_PAPER_CONFIG_TABLE_ID }}
      FEISHU_WECHAT_CONFIG_TABLE_ID: ${{ secrets.FEISHU_WECHAT_CONFIG_TABLE_ID }}
      FEISHU_VIDEO_CONFIG_TABLE_ID: ${{ secrets.FEISHU_VIDEO_CONFIG_TABLE_ID }}
      FEISHU_SOCIAL_CONFIG_TABLE_ID: ${{ secrets.FEISHU_SOCIAL_CONFIG_TABLE_ID }}
      FEISHU_GITHUB_CONFIG_TABLE_ID: ${{ secrets.FEISHU_GITHUB_CONFIG_TABLE_ID }}
      FEISHU_RECIPIENT_OPEN_ID: ${{ secrets.FEISHU_RECIPIENT_OPEN_ID }}
      FEISHU_RECIPIENT_OPEN_IDS: ${{ secrets.FEISHU_RECIPIENT_OPEN_IDS }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
      # GitHub 热榜要查搜索/README/issue：未鉴权每小时只有 60 次，一轮就会被限流。
      # runner 自带的这个 token 只读公开仓库即可，额度 5000/h。
      GITHUB_TOKEN: ${{ github.token }}
      # 论文社区热度富集在海外 runner 上易超时，默认关闭；如需可在 Secrets/Variables 覆盖。
      PAPER_ENRICH_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Ingest real RSS signals
        run: python -m src.main

      - name: Analyze and write daily brief
        run: python -m src.daily --output output/daily-brief.json

      - name: Build static site from Feishu
        run: python -m src.publish --input output/daily-brief.json

      # Pages 的内容是每次 run 的产物、不落库；而 pages-preview.yml 会在任何一次
      # 改前端的 push 上、用仓库里的 site/ 重新部署。不回写就会出现「改一次前端，
      # 线上简报被打回上次提交时的日期」。回写后两条部署路径的内容才一致。
      - name: Commit generated brief data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site
          if git diff --cached --quiet; then
            echo "站点数据无变化，跳过提交"
          else
            git commit -m "chore(site): 发布 $(TZ=Asia/Shanghai date +%Y-%m-%d) 简报数据 [skip ci]"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send Feishu card
        env:
          PUBLIC_BASE_URL: ${{ steps.deployment.outputs.page_url }}
          FORCE_FLAG: ${{ inputs.force_send && '--force' || '' }}
        run: python -m src.notify --input output/daily-brief.json $FORCE_FLAG
