name: Daily AI Signal Brief

on:
  schedule:
    # 北京时间每天 10:45（UTC 02:45）。GitHub 定时可能再晚几分钟。
    - cron: "45 2 * * *"
  workflow_dispatch:
    inputs:
      force_send:
        description: "即使今天已发送也重新推送"
        type: boolean
        default: false

permissions:
  # 生成的简报数据要回写仓库，否则只存在于本次 run 的 Pages 产物里
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-ai-signal
  cancel-in-progress: false

jobs:
  build:
    # LLM Center 仅允许本机飞连网络访问；使用专用 Mac Runner，
    # 避免 GitHub 托管 Runner 的动态公网出口被 WAF 拦截。
    runs-on: [self-hosted, macOS, ARM64, feishu-ai-signal]
    timeout-minutes: 45
    # 所有步骤共享的配置：一处集中，避免各步骤漏传导致新库回退到旧库默认表 ID。
    env:
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_BASE_ID: ${{ secrets.FEISHU_BASE_ID }}
      FEISHU_SOURCE_TABLE_ID: ${{ secrets.FEISHU_SOURCE_TABLE_ID }}
      FEISHU_PARAM_TABLE_ID: ${{ secrets.FEISHU_PARAM_TABLE_ID }}
      FEISHU_ENTRY_TABLE_ID: ${{ secrets.FEISHU_ENTRY_TABLE_ID }}
      FEISHU_BRIEF_TABLE_ID: ${{ secrets.FEISHU_BRIEF_TABLE_ID }}
      FEISHU_TRACKED_ENTITY_TABLE_ID: ${{ secrets.FEISHU_TRACKED_ENTITY_TABLE_ID }}
      FEISHU_TRACKED_EVENT_TABLE_ID: ${{ secrets.FEISHU_TRACKED_EVENT_TABLE_ID }}
      FEISHU_PAPER_CONFIG_TABLE_ID: ${{ secrets.FEISHU_PAPER_CONFIG_TABLE_ID }}
      FEISHU_WECHAT_CONFIG_TABLE_ID: ${{ secrets.FEISHU_WECHAT_CONFIG_TABLE_ID }}
      FEISHU_VIDEO_CONFIG_TABLE_ID: ${{ secrets.FEISHU_VIDEO_CONFIG_TABLE_ID }}
      FEISHU_SOCIAL_CONFIG_TABLE_ID: ${{ secrets.FEISHU_SOCIAL_CONFIG_TABLE_ID }}
      FEISHU_GITHUB_CONFIG_TABLE_ID: ${{ secrets.FEISHU_GITHUB_CONFIG_TABLE_ID }}
      FEISHU_RECIPIENT_OPEN_ID: ${{ secrets.FEISHU_RECIPIENT_OPEN_ID }}
      FEISHU_RECIPIENT_OPEN_IDS: ${{ secrets.FEISHU_RECIPIENT_OPEN_IDS }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
      # GitHub 热榜要查搜索/README/issue：未鉴权每小时只有 60 次，一轮就会被限流。
      # runner 自带的这个 token 只读公开仓库即可，额度 5000/h。
      GITHUB_TOKEN: ${{ github.token }}
      # 论文社区热度富集在海外 runner 上易超时，默认关闭；如需可在 Secrets/Variables 覆盖。
      PAPER_ENRICH_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Use prebuilt local Python environment
        run: |
          test -x /Users/batlap/Projects/feishu-ai-signal/.venv/bin/python
          echo "/Users/batlap/Projects/feishu-ai-signal/.venv/bin" >> "$GITHUB_PATH"

      - name: Verify dependencies
        run: python -m pip check

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Ingest real RSS signals
        run: python -m src.main

      - name: Analyze and write daily brief
        run: python -m src.daily --output output/daily-brief.json

      - name: Build static site from Feishu
        run: python -m src.publish --input output/daily-brief.json

      - name: Update tracked entity timelines
        run: python -m src.timeline --output site/data/timeline-latest.json

      - name: Upload generated site
        uses: actions/upload-artifact@v4
        with:
          name: generated-site
          path: site
          include-hidden-files: true
          retention-days: 1

  deploy-send:
    # Pages 官方上传 action 在 macOS 上依赖额外的 gtar。Mac 只生成并上传产物，
    # 托管 Runner 负责回写仓库、静态部署和通知，不再从公网调用 LLM Center。
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_BASE_ID: ${{ secrets.FEISHU_BASE_ID }}
      FEISHU_BRIEF_TABLE_ID: ${{ secrets.FEISHU_BRIEF_TABLE_ID }}
      FEISHU_RECIPIENT_OPEN_ID: ${{ secrets.FEISHU_RECIPIENT_OPEN_ID }}
      FEISHU_RECIPIENT_OPEN_IDS: ${{ secrets.FEISHU_RECIPIENT_OPEN_IDS }}
      FEISHU_RECIPIENT_CHAT_IDS: ${{ secrets.FEISHU_RECIPIENT_CHAT_IDS }}
      FEISHU_RECIPIENT_CHAT_NAMES: ${{ secrets.FEISHU_RECIPIENT_CHAT_NAMES }}
      FEISHU_RECIPIENT_NAMES: ${{ secrets.FEISHU_RECIPIENT_NAMES }}
      FEISHU_DELIVERY_REPORT_OPEN_ID: ${{ secrets.FEISHU_DELIVERY_REPORT_OPEN_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Replace site with generated artifact
        run: rm -rf site

      - uses: actions/download-artifact@v4
        with:
          name: generated-site
          path: site

      # 回写生成结果，避免后续只改前端时 pages-preview 用旧数据重新部署。
      - name: Commit generated brief data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site
          if git diff --cached --quiet; then
            echo "站点数据无变化，跳过提交"
          else
            git commit -m "chore(site): 发布 $(TZ=Asia/Shanghai date +%Y-%m-%d) 简报数据 [skip ci]"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send Feishu card
        env:
          PUBLIC_BASE_URL: ${{ steps.deployment.outputs.page_url }}
          FORCE_FLAG: ${{ inputs.force_send && '--force' || '' }}
        run: python -m src.notify --input site/data/brief-latest.json $FORCE_FLAG
