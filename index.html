<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Signal 智能仪表板 v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@600;700&family=Source+Serif+4:opsz,wght@8..60,600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     浅色蓝黑主题 — 所有视觉色集中在此 :root。
     改配色 = 只改这里(刷新即看)。accent 换色由 --ds-accent 派生。
     ============================================================ */
  :root {
    /* 中性表面:全部纯白 */
    --ds-canvas: #ffffff;          /* 页底:纯白 */
    --ds-section: #ffffff;         /* 内容区列底:纯白 */
    --ds-panel-solid: #ffffff;     /* 浅色对比块 */
    --ds-panel: #ffffff;           /* 面板 */
    --ds-card: #ffffff;            /* 卡片底 */

    /* 描边:实心墨线(编辑风,加重以强化分区可读性) */
    --ds-border: rgba(22,19,15,.24);
    --ds-border-2: rgba(22,19,15,.42);
    --ds-hair: rgba(22,19,15,.14);
    --ds-chip: rgba(22,19,15,.05);
    --ds-ink-line: #16130f;        /* 主结构墨线(卡片外框/分区) */

    /* 叠加(替代原白色玻璃叠加) */
    --ds-fill-1: rgba(22,19,15,.04);
    --ds-fill-2: rgba(22,19,15,.02);
    --ds-fill-3: rgba(22,19,15,.06);

    /* 文字 */
    --ds-text: #16130f;            /* 主(近黑) */
    --ds-text-2: #4a453d;
    --ds-text-3: #6f685e;
    --ds-on-dark: #faf7f0;         /* 深色块上的浅字 */

    /* 强调:蓝 */
    --ds-accent: #2458b5;
    --ds-accent-soft: color-mix(in srgb, var(--ds-accent) 10%, transparent);
    --ds-accent-border: color-mix(in srgb, var(--ds-accent) 45%, transparent);
    --ds-accent-glow: transparent;                                   /* 浅色去辉光 */
    --ds-accent-faint: color-mix(in srgb, var(--ds-accent) 6%, transparent);
    --ds-accent-bright: var(--ds-accent);                            /* 浅底不提亮 */
    --ds-accent-deep: color-mix(in srgb, var(--ds-accent), black 30%);

    /* 状态 */
    --ds-good: #1f7a45; --ds-good-bg: rgba(31,122,69,.10); --ds-good-border: rgba(31,122,69,.45);
    --ds-warn: #a06600; --ds-warn-bg: rgba(160,102,0,.10); --ds-warn-border: rgba(160,102,0,.45);
    --ds-crit: #c22f2a; --ds-crit-bg: rgba(194,47,42,.08); --ds-crit-border: rgba(194,47,42,.45);

    /* 图表类别色(降饱和适配浅底) */
    --ds-cat-1: #2b6cb0; --ds-cat-2: #1f7a45; --ds-cat-3: #a06600; --ds-cat-4: #5a4fb5;
    --ds-cat-5: #c22f2a; --ds-cat-6: #b23a6a; --ds-cat-7: #bf4a1e; --ds-cat-8: #2f6b2f;

    /* 圆角:直角化 */
    --ds-radius-sm: 0px; --ds-radius: 0px; --ds-radius-lg: 2px; --ds-radius-xl: 2px;

    /* 兼容旧变量名(简报条等) */
    --accent: var(--ds-accent);
    --accent-soft: var(--ds-accent-soft);
    --accent-border: var(--ds-accent-border);
    --accent-deep: var(--ds-accent-deep);
    --accent-bright: var(--ds-accent-bright);
    --accent-faint: var(--ds-accent-faint);
    --accent-glow: var(--ds-accent-glow);
  }
  body { margin: 0; background: var(--ds-canvas); color: var(--ds-text); font-family: "Geist", "PingFang SC", "Microsoft YaHei", sans-serif; }
  a { color: var(--ds-text); text-decoration: none; }
  a:hover { color: var(--accent-bright, #2458b5); }
  ::selection { background: color-mix(in srgb, var(--ds-accent) 22%, transparent); }
  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(22,19,15,.18); border-radius: 8px; border: 3px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(22,19,15,.2); }
  @keyframes hairline { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes slideRight { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
  button, input, select, textarea { font-family: inherit; }
  /* ------------------------------------------------------------------
     首页三列骨架:左栏板块筛选 / 中间信息流 / 右栏数据看板（话题热度在最上）。
     ------------------------------------------------------------------ */
  .feed-shell { display: grid; grid-template-columns: 148px minmax(0, 1fr) 304px; grid-template-areas: "points points points" "nav feed data"; gap: 24px; max-width: 1480px; margin: 0 auto; padding: 26px 24px 60px; align-items: start; --feed-data-col: 304px; --feed-gap: 24px; }
  /* 三个格子都要 min-width:0。栅格项默认 min-width:auto，里面一行横滑的筛选条
     或一个不折行的长标题就能把整列顶宽，窄屏上整页跟着横向溢出。 */
  .feed-points { grid-area: points; min-width: 0; }
  .feed-nav { grid-area: nav; min-width: 0; position: sticky; top: 76px; }
  .nav-all { display: flex; flex-direction: column; align-items: stretch; gap: 6px; margin-bottom: 12px; }
  .nav-all-btn { width: 100%; height: 34px; border: 1.5px solid var(--ds-ink-line); background: #0a0a0a; color: #faf7f0; font-size: 12.5px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .nav-all-btn.on { background: var(--ds-accent); color: #fff; border-color: var(--ds-accent); }
  .nav-all-btn:hover { background: #fff; color: #16130f; }
  .nav-clear { flex: none; border: none; background: none; padding: 0 4px; font-size: 11.5px; color: var(--ds-accent); cursor: pointer; font-family: inherit; white-space: nowrap; }
  .nav-clear:hover { text-decoration: underline; }
  .nav-block { border: 1.5px solid var(--ds-ink-line); overflow: hidden; background: #0a0a0a; box-shadow: 5px 5px 0 rgba(22,19,15,.10); }
  .nav-block.formats { margin-top: 12px; }
  .nav-block .nav-item { background: transparent; color: #faf7f0; }
  .nav-block .nav-item.is-empty { background: #5a564f; color: #c4bfb6; }
  .nav-block .nav-item:hover { background: #fff; color: #16130f; }
  .nav-block .nav-item.on { background: var(--ds-accent); color: #fff; }
  .nav-block .nav-item.on:hover { background: #fff; color: #16130f; }
  .feed-main { grid-area: feed; min-width: 0; }
  .feed-data { grid-area: data; min-width: 0; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 76px; max-height: calc(100vh - 92px); overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.32) transparent; }
  .feed-data > * { flex: none; }
  .feed-data::-webkit-scrollbar { width: 7px; }
  .feed-data::-webkit-scrollbar-thumb { background: rgba(255,255,255,.32); }
  .feed-data::-webkit-scrollbar-track { background: transparent; }
  .quote-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 6px; align-items: baseline; padding: 5px 8px; border-bottom: 1px solid rgba(255,255,255,.05); text-decoration: none; color: inherit; }
  .quote-row:hover { background: #fff; }
  .quote-name { color: #faf7f0; }
  .quote-pct { color: var(--pct, #faf7f0); }
  .quote-row:hover .quote-name { color: #16130f; }
  .quote-row:hover .quote-pct { color: var(--pct-light, #16130f); }
  .aa-tabs { display: flex; border: 1px solid rgba(255,255,255,.12); margin: 8px 14px; }
  .aa-tabs button { flex: 1; height: 26px; min-width: 0; padding: 0 3px; border: none; background: transparent; color: #8f887a; font-size: 11px; font-weight: 650; white-space: nowrap; cursor: pointer; }
  .aa-tabs button + button { border-left: 1px solid rgba(255,255,255,.12); }
  .aa-tabs button.on { background: var(--ds-accent); color: #fff; }
  .aa-tag { position: relative; flex: 0 1 auto; max-width: 52%; font-size: 9.5px; font-weight: 600; color: rgba(250,247,240,.62); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 参数规模最多七个字符,不参与压缩:挤成「30…」比不显示还没用,该让模型名去省地方。
     档位后缀（Adaptive Reasoning, High）可以长得多,仍按上面那条先缩。 */
  .aa-tag.is-size { flex: none; max-width: none; }
  .heat-toggle { display: flex; border: 1px solid rgba(255,255,255,.12); margin: 0 14px 8px; }
  .heat-toggle button { flex: 1; height: 26px; border: none; background: transparent; color: #8f887a; font-size: 11px; font-weight: 650; cursor: pointer; }
  .heat-toggle button + button { border-left: 1px solid rgba(255,255,255,.12); }
  .heat-toggle button.on { background: var(--ds-accent); color: #fff; }
  .heat-legend { display: flex; align-items: center; gap: 4px; padding: 0 14px 8px; font-size: 9.5px; color: #8f887a; }
  .heat-legend i { width: 14px; height: 8px; display: inline-block; border: 1px solid rgba(255,255,255,.22); }
  .heat-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 4px 10px 10px; }
  .heat-table { border-collapse: separate; border-spacing: 2px; font-size: 11px; min-width: 100%; }
  .heat-table thead th { font-family: "Geist Mono", ui-monospace, Menlo, monospace; font-size: 9px; font-weight: 600; color: #8f887a; padding: 0 1px 5px; text-align: center; }
  .heat-table tbody th { position: sticky; left: 0; z-index: 1; background: #0a0a0a; text-align: left; font-weight: 600; padding: 0 8px 0 4px; white-space: nowrap; color: #faf7f0; }
  .heat-table td { padding: 0; }
  .heat-mark { flex: none; font-size: 12px; line-height: 1; margin-right: 4px; }
  .heat-news { display: inline-flex; align-items: baseline; max-width: 118px; color: inherit; text-decoration: none; cursor: pointer; }
  .heat-news:hover .heat-topic { text-decoration: underline; }
  .heat-topic { font-size: 11.5px; max-width: 78px; display: inline-block; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; }
  .heat-badge { margin-left: 3px; font-size: 10px; }
  .heat-cell { width: 24px; height: 20px; border: 1px solid rgba(22,19,15,.16); padding: 0; cursor: pointer; font-family: "Geist Mono", ui-monospace, Menlo, monospace; font-size: 8px; font-weight: 700; }
  .heat-cell.is-on { outline: 2px solid var(--ds-accent); outline-offset: -2px; }
  .heat-panel { margin: 0 10px 10px; padding: 8px 10px 10px; border: 1px solid rgba(255,255,255,.10); background: rgba(255,255,255,.04); }
  .heat-panel-h { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; font-size: 12px; font-weight: 700; color: #faf7f0; }
  .heat-x { margin-left: auto; border: none; background: none; padding: 0; font-size: 11px; color: #ff8d86; cursor: pointer; font-family: inherit; }
  .heat-hits { display: flex; flex-direction: column; max-height: 160px; overflow: auto; }
  .heat-hit { display: block; padding: 6px 0; border-bottom: 1px dashed rgba(255,255,255,.10); font-size: 11.5px; line-height: 1.45; color: #faf7f0; }
  .heat-hit:last-child { border-bottom: none; }
  .heat-hit .src { display: block; margin-top: 2px; font-size: 10px; color: #8f887a; }
  .heat-empty, .heat-status { margin: 0; padding: 8px 14px 14px; font-size: 11.5px; line-height: 1.6; color: #8f887a; }
  .heat-tip { position: fixed; z-index: 80; max-width: 240px; padding: 8px 10px; background: #16130f; color: #faf7f0; font-size: 11.5px; line-height: 1.55; pointer-events: none; box-shadow: 4px 4px 0 rgba(0,0,0,.25); }
  /* 两列:右栏落到左栏下面,信息流保持一整条 */
  @media (max-width: 1280px) {
    .feed-shell { grid-template-columns: 148px minmax(0, 1fr); grid-template-areas: "points points" "nav feed" "data feed"; }
    .feed-nav { position: static; }
    .feed-data { position: static; max-height: none; overflow: visible; margin-top: 18px; }
  }
  /* --- 信号卡片:可点,悬停做硬阴影位移(编辑/野兽派风) --- */
  .signal-card { cursor: pointer; transition: transform .12s ease, box-shadow .12s ease; align-items: stretch; height: 288px; }
  .signal-card:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ds-accent) !important; }
  .signal-card:hover .card-hint { opacity: 1; transform: translateX(0); }
  .card-hint { opacity: 0; transform: translateX(-4px); transition: opacity .2s ease, transform .2s ease; }
  .sc-media { flex: none; width: 288px; height: 288px; align-self: flex-start; overflow: hidden; }
  .sc-body { min-height: 0; height: 100%; }
  .sc-main { display: flex; flex-direction: column; }
  .sc-spacer { flex: 1 1 0; min-height: 0; }
  .sc-copy { flex: none; }
  .personal-viewport { overflow: hidden; cursor: grab; user-select: none; touch-action: none; }
  .personal-viewport.is-drag { cursor: grabbing; }
  .personal-card img { -webkit-user-drag: none; pointer-events: none; }
  .personal-grid { display: flex; width: max-content; will-change: transform; }
  .personal-set { display: flex; gap: 16px; padding-right: 16px; }
  .personal-viewport.is-static { overflow: visible; cursor: default; touch-action: auto; user-select: auto; }
  .personal-viewport.is-static .personal-grid { transform: none !important; will-change: auto; width: 100%; }
  .personal-viewport.is-static .personal-set { width: 100%; justify-content: center; padding-right: 0; }
  .personal-viewport.is-static .personal-set[aria-hidden] { display: none; }
  .points-bar { margin: 10px 0 28px; height: 16px; padding: 5px 0; cursor: pointer; }
  .personal-viewport.is-static + .points-bar { display: none; }
  .points-bar-track { position: relative; height: 6px; background: rgba(22,19,15,.12); border: 1px solid var(--ds-ink-line); }
  .points-bar-thumb { position: absolute; top: -5px; width: 42px; height: 16px; background: var(--ds-accent); border: 1.5px solid var(--ds-ink-line); pointer-events: none; }
  .personal-card { flex: 0 0 272px; width: 272px; min-width: 0; box-sizing: border-box; display: flex; flex-direction: column; background: #fff; border: 1px solid rgba(22,19,15,.10); border-radius: 14px; overflow: hidden; box-shadow: 0 10px 24px -14px rgba(22,19,15,.28); transition: transform .16s ease, box-shadow .16s ease; }
  .personal-card:hover { transform: translateY(-3px); box-shadow: 0 16px 32px -16px rgba(22,19,15,.38); }
  .pc-media { position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: #111; }
  .pc-media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .pc-fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: "Geist Mono", ui-monospace, Menlo, monospace; font-size: 33px; font-weight: 700; opacity: .45; }
  .pc-title { margin: 0; padding: 16px 18px 18px; font-family: "Source Serif 4", "Noto Serif SC", "Songti SC", Georgia, serif; font-size: 17px; font-weight: 700; line-height: 1.45; letter-spacing: -.01em; color: var(--ds-text); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; overflow: hidden; }
  .src-row:hover { background: rgba(22,19,15,.03); }
  .src-link:hover { color: var(--accent-bright, #a78bff) !important; border-bottom-color: var(--accent-bright, #a78bff) !important; }
  .del-btn:hover { color: #ff8a8a !important; border-color: rgba(255,120,120,.4) !important; }
  .add-btn:hover { filter: brightness(1.12); }
  .swatch { cursor: pointer; width: 16px; height: 16px; border-radius: 5px; border: 1px solid rgba(22,19,15,.25); padding: 0; }
  .swatch.active { box-shadow: 0 0 0 2px #08080a, 0 0 0 4px rgba(255,255,255,.6); }
  /* --- 顶部主导航(浅色条上,方角卡片按钮) --- */
  .top-item { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px; cursor: pointer; color: var(--ds-text-2); transition: color .15s ease, background .15s ease, border-color .15s ease; border: 1.5px solid var(--ds-ink-line); background: #fff; font-size: 13px; font-weight: 600; font-family: inherit; }
  .top-item:hover { background: var(--ds-accent-faint); color: var(--ds-text); }
  .top-item.active { font-weight: 700; }
  .top-item svg { width: 17px; height: 17px; }
  /* --- 底部 AI 对话条(浅色) --- */
  .bot-input { flex: 1; height: 40px; padding: 0 14px; border: 1.5px solid var(--ds-ink-line); background: #fff; color: var(--ds-text); font-size: 13px; outline: none; }
  .bot-input::placeholder { color: var(--ds-text-3); }
  .bot-input:focus { box-shadow: inset 0 0 0 1px var(--ds-accent); }
  /* --- 详情覆盖层 --- */
  .detail-overlay { position: fixed; inset: 0; z-index: 200; display: flex; align-items: flex-start; justify-content: center; padding: 40px 20px; background: rgba(4,4,6,.72); backdrop-filter: blur(8px); overflow-y: auto; animation: fadeIn .18s ease; }
  .detail-panel { position: relative; width: 100%; max-width: 1040px; margin: auto; border-radius: 20px; background: var(--ds-panel); border: 1px solid rgba(22,19,15,.12); box-shadow: 0 40px 90px -30px rgba(0,0,0,.85); overflow: hidden; animation: popIn .24s cubic-bezier(.2,.7,.3,1); }
  /* --- 详情页标签 --- */
  .dtab { height: 38px; padding: 0 16px; border: 1.5px solid var(--ds-ink-line); background: #fff; color: var(--ds-text-2); font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .dtab.on { background: var(--ds-accent); color: #fff; font-weight: 700; }
  /* --- 正文笔记:高亮 / 下划线 / 悬浮折叠评论 --- */
  .note-hl { background: #fff2a8; padding: 0 2px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .note-ul { border-bottom: 2px solid var(--ds-accent); padding-bottom: 1px; }
  .note-cmt { position: relative; background: var(--ds-accent-faint); border-bottom: 2px dotted var(--ds-accent); cursor: help; }
  .note-cmt .cmt-pop { display: none; position: absolute; left: 0; top: 100%; margin-top: 6px; z-index: 30; width: 260px; padding: 10px 12px; background: #16130f; color: #faf7f0; font-size: 12px; line-height: 1.6; box-shadow: 0 12px 30px -10px rgba(0,0,0,.6); }
  .note-cmt .cmt-pop b { color: var(--ds-accent-bright); }
  .note-cmt:hover .cmt-pop { display: block; }
  .detail-close { position: absolute; top: 16px; right: 16px; z-index: 3; width: 34px; height: 34px; border-radius: 9px; border: 1px solid rgba(22,19,15,.14); background: rgba(22,19,15,.06); color: var(--ds-text-2); font-size: 17px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .detail-close:hover { background: rgba(22,19,15,.12); }
  .rel-card:hover { border-color: var(--accent-border, rgba(108,71,255,.4)) !important; background: rgba(22,19,15,.05) !important; }
  .fig-tile:hover { transform: translateY(-2px); filter: brightness(1.08); }
  /* --- 辩论气泡 --- */
  .debate-post { animation: slideRight .3s ease both; }
  .send-btn:hover { filter: brightness(1.12); }
  .chip-btn:hover { border-color: var(--accent-border, rgba(36,88,181,.4)) !important; color: var(--ds-text) !important; }
  .cmt-row:hover { background: rgba(22,19,15,.03); }
  .like-btn:hover { border-color: var(--accent-border) !important; color: var(--accent-bright) !important; }
  .strategy-map { padding:22px 0 0; background:#fff; border:1.5px solid var(--ds-ink-line); overflow-x:auto; color: var(--ds-text); }
  .strategy-map-head, .strategy-map-overview, .strategy-flow-head, .strategy-relations { padding-left:24px; padding-right:24px; }
  .strategy-map-head { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .strategy-map-head h2 { margin:0; font-size:18px; color: var(--ds-text); }
  .strategy-map-head span { font-size:10.5px; color: var(--ds-text-3); }
  .strategy-map-overview { margin:12px 0 18px; font-size:12.5px; line-height:1.75; color: var(--ds-text-2); }
  .strategy-flow { display:grid; grid-template-columns:minmax(200px,1fr) 28px minmax(220px,1.1fr) 28px minmax(240px,1.25fr); gap:6px; align-items:center; }
  .strategy-flow-head { padding-top:2px; padding-bottom:12px; align-items:end; }
  .strategy-flow-head > span:nth-child(odd) { text-align:center; font-size:13px; font-weight:800; letter-spacing:.14em; color: var(--ds-text); padding-bottom:7px; border-bottom:2px solid var(--ds-accent); }
  .strategy-row { margin:0; padding:18px 24px; border:0; }
  .strategy-col { display:flex; flex-direction:column; justify-content:center; gap:10px; min-width:0; }
  .strategy-spine { position:relative; padding-left:22px; }
  .strategy-spine::before { content:''; position:absolute; left:6px; top:12px; bottom:12px; width:1.5px; }
  .strategy-node { position:relative; display:grid; grid-template-columns:72px minmax(0,1fr) auto; gap:8px; align-items:start; padding:8px 0 8px 6px; text-decoration:none; color:inherit; }
  .strategy-node::before { content:''; position:absolute; left:-19px; top:12px; width:9px; height:9px; transform:rotate(45deg); border:1.5px solid; }

function packHeatSource(rawMap, kind){
  const days = ['08-21','08-22','08-23','08-24','08-25','08-26','今天'];
  const raw = HEAT_TOPIC_KEYS.map(t => (rawMap[t] || days.map(()=>0)).slice());
  const normalized = raw.map(row => {
    const peak = Math.max(...row, 1);
    return row.map(v => +(v / peak).toFixed(4));
  });
  const trend = {};
  const items = {};
  const itemIndex = {};
  HEAT_TOPIC_KEYS.forEach((topic, i) => {
    const row = raw[i];
    const prior = row.slice(0, -1);
    const priorMean = prior.reduce((a,b)=>a+b,0) / (prior.length || 1);
    trend[topic] = priorMean ? +(row[row.length-1] / priorMean).toFixed(3) : 1;
    days.forEach((day, j) => {
      const q = HEAT_QUERIES[topic] || { g:topic, x:'#'+topic };
      const ident = `${kind}-${topic}-${day}`;
      const isG = kind === 'g';
      itemIndex[ident] = {
        title: isG ? `Google Trends · ${q.g}` : `X 热搜 · ${q.x}`,
        source: isG ? 'Google Trends' : 'X',
        url: isG
          ? `https://trends.google.com/trends/explore?q=${encodeURIComponent(q.g)}`
          : `https://x.com/search?q=${encodeURIComponent(q.x)}&src=typed_query&f=live`,
      };
      items[`${topic}|${day}`] = [ident];
    });
  });
  return { days, raw, normalized, trend, items, itemIndex };
}

function hexToRgb(h){ const m=h.replace('#',''); const n=parseInt(m.length===3?m.split('').map(c=>c+c).join(''):m,16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function scoreColor(v){ if(v>=75) return '#16a34a'; if(v>=55) return '#ca8a04'; return '#dc2626'; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shortText(s,n=180){ const t=String(s||'').trim(); return t.length>n?t.slice(0,n).replace(/[，,；;。\s]+$/,'')+'…':t; }
function zhProse(s){
  return String(s)
    .replace(/,(?=[\u3400-\u9fff“「（])/g, '，')
    .replace(/:(?=[\u3400-\u9fff“「（])/g, '：')
    .replace(/;(?=[\u3400-\u9fff“「（])/g, '；')
    .replace(/([\u3400-\u9fff])\s+(?=[\u3400-\u9fff])/g, '$1')
    .replace(/\s*([，。；：！？、])\s*/g, '$1');
}
function zhProseHtml(html){
  return String(html).split(/(<[^>]+>)/g).map(part=>part.startsWith('<') ? part : zhProse(part)).join('')
    .replace(/([\u3400-\u9fff])\s+(<)/g, '$1$2')
    .replace(/(>)\s+([\u3400-\u9fff])/g, '$1$2');
}

function isConfigHost(){

function applySourcePayload(body){
  state.sources = Array.isArray(body.sources) ? body.sources : [];
  state.sourceMeta = { ...state.sourceMeta, ...(body.meta || {}) };
  state.sourceStamp = body.generatedAt || '';
  state.sourceOrigin = body.origin || 'feishu';
  state.briefWindowDays = Number(body.briefWindowDays) || 0;
  const meta = state.sourceMeta;
  if(meta.types?.length && !meta.types.includes(state.formType)) state.formType = meta.types[0];
  if(meta.formats?.length && !meta.formats.includes(state.formFormat)) state.formFormat = meta.formats[0];
  if(meta.priorities?.length && !meta.priorities.includes(state.formPriority)) state.formPriority = meta.priorities[Math.min(1, meta.priorities.length-1)];
}
async function loadSources(){
  state.sourceSync = { status:'loading', connected:state.sourceSync.connected, busy:false, message:'正在读取信号源配置…' };
  render();
  if(isConfigHost()){
    try {
      applySourcePayload(await sourceApi('/api/sources'));
      state.sourceSync = { status:'connected', connected:true, busy:false, message:`配置台已连接 · ${state.sources.length} 个源` };
      render();
      return;
    } catch(error) {
      state.sourceSync = { status:'loading', connected:false, busy:false, message:`配置台未启动 · ${error.message}` };
    }
  }
  try {
    const response = await fetch('data/sources.json', { cache:'no-store' });
    if(!response.ok) throw new Error(`HTTP ${response.status}`);

const MARKET_TICKERS = [
  ['usNVDA','美股','nvidia.com'],['usAMD','美股','amd.com'],['usAVGO','美股','broadcom.com'],
  ['usTSM','美股','tsmc.com'],['usMU','美股','micron.com'],['usARM','美股','arm.com'],

  ['sz000977','A股','inspur.com'],['sh601138','A股','fii-foxconn.com'],['sz002230','A股','iflytek.com'],
  ['sh688111','A股',''],['sz300418','A股',''],['sh601360','A股','360.cn'],
  ['hk02513','港股','z.ai'],['hk00100','港股','minimaxi.com'],['hk06082','港股',''],['hk09903','港股',''],
];
const QUOTE_Q = { NAME:1, SYMBOL:2, PRICE:3, PREV:4, OPEN:5, STAMP:30, PCT:32, HIGH:33, LOW:34, CAP:45 };

function parseGtimgQuotes(text){
  const markets = Object.fromEntries(MARKET_TICKERS.map(([code, market]) => [code, market]));
  const logos = Object.fromEntries(MARKET_TICKERS.map(([code, , domain]) => [code, domain]));
  const order = Object.fromEntries(MARKET_TICKERS.map(([code], i) => [code, i]));
  const rows = [];
  const re = /v_(\w+)="([^"]*)"/g;
  let match;
  while((match = re.exec(text))){
    const code = match[1];
    const parts = match[2].split('~');
    if(parts.length <= QUOTE_Q.CAP) continue;
    const price = Number(parts[QUOTE_Q.PRICE]);
    const prev = Number(parts[QUOTE_Q.PREV]);
    if(!price) continue;
    let change = Number.isFinite(prev) ? price - prev : null;
    let pct = Number(parts[QUOTE_Q.PCT]);
    if(!Number.isFinite(pct) && change !== null && prev) pct = change / prev * 100;
    const prefix = code.slice(0, 2);
    rows.push({
      code,
      market: markets[code] || '',
      name: parts[QUOTE_Q.NAME] || '',
      symbol: String(parts[QUOTE_Q.SYMBOL] || '').split('.')[0],
      logoDomain: logos[code] || '',
      url: '',
      currency: prefix === 'us' ? 'USD' : prefix === 'hk' ? 'HKD' : 'CNY',
      price,
      change,
      changePct: Number.isFinite(pct) ? pct : null,
      open: Number(parts[QUOTE_Q.OPEN]) || null,
      high: Number(parts[QUOTE_Q.HIGH]) || null,
      low: Number(parts[QUOTE_Q.LOW]) || null,
      prevClose: Number.isFinite(prev) ? prev : null,
      marketCap: Number(parts[QUOTE_Q.CAP]) || null,
      quotedAt: parts[QUOTE_Q.STAMP] || '',
    });
  }
  rows.sort((a, b) => (order[a.code] ?? 999) - (order[b.code] ?? 999));
  return rows;
}

async function fetchLiveMarket(){
  const url = 'https://qt.gtimg.cn/q=' + MARKET_TICKERS.map(item => item[0]).join(',');
  const response = await fetch(url, { cache: 'no-store' });
  if(!response.ok) throw new Error('HTTP ' + response.status);
  const buffer = await response.arrayBuffer();
  let text = '';
  for(const enc of ['gbk', 'gb18030', 'utf-8']){
    try {
      text = new TextDecoder(enc).decode(buffer);
      if(text.includes('v_')) break;
    } catch(e) {}
  }
  const quotes = parseGtimgQuotes(text);
  if(!quotes.length) throw new Error('empty quotes');
  const stamp = new Intl.DateTimeFormat('sv-SE', {
    timeZone: 'Asia/Shanghai', year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit',
  }).format(new Date()).replace(' ', 'T') + '+08:00';
  return { sourceUrl: 'https://stockapp.finance.qq.com/', updatedAt: stamp, error: '', live: true, quotes };
}

  async saveDetail(){
    const d=state.srcDetail;
    if(!d.data || !d.draft || d.saving) return;
    // 只提交真正改过的字段，未改动的字段不该出现在写请求里
    const patch={};
    Object.keys(d.data.config).forEach(key=>{
      if(key==='status') return;                      // 状态由开关和自动降级管
      if(String(d.draft[key] ?? '')!==String(d.data.config[key] ?? '')) patch[key]=d.draft[key];
    });
    if(!Object.keys(patch).length){ d.message='没有改动'; d.error=''; render(); return; }
    d.saving=true; d.error=''; d.message='正在写回飞书…';
    render();
    try {
      const body=await sourceApi(`/api/sources/${encodeURIComponent(d.recordId)}`, { method:'PATCH', body:JSON.stringify(patch) });
      const notes=[`已写回 ${(body.changed||[]).length} 个字段`];
      if(body.demoted) notes.push('已按约定退回「待测」，验收通过后再启用');
      if(body.seed) notes.push(body.seed.ok?'仓库快照已刷新':`仓库快照未刷新 · ${body.seed.message}`);
      state.srcDetail={ ...d, saving:false, error:'', message:notes.join(' · '), data:body.detail||d.data, draft:{ ...((body.detail||d.data).config) } };
      const index=state.sources.findIndex(x=>String(x.recordId)===String(d.recordId));
      if(index>=0 && body.detail){
        const cfg=body.detail.config;
        state.sources[index]={ ...state.sources[index], name:cfg.name, url:cfg.endpoint, fetchMethod:cfg.fetchMethod,
          format:cfg.format, type:cfg.dimension, tier:cfg.tier, priority:cfg.priority, lookback:cfg.lookbackWindow,
          status:cfg.status, on:cfg.status==='active', statusLabel:STATUS_LABELS[cfg.status]||cfg.status };
      }
    } catch(error) {
      state.srcDetail={ ...d, saving:false, error:error.message, message:'' };
    }
    render();
  },
  async removeSrc(id){
    const index=state.sources.findIndex(x=>String(x.id)===String(id));
    if(index<0 || !this.canWrite('delete')) return;
    const removed=state.sources[index];
    if(!confirm(`确认从飞书参数表删除「${removed.name}」？该操作不可撤销。`)) return;
    state.sources.splice(index,1);

    } catch(error) {
      state.sources.splice(index,0,removed);
      state.sourceSync={ status:'error', connected:true, busy:false, message:`删除失败 · ${error.message}` };
    }
    render();
  },
  setForm(key,val){ state[key]=val; if(key==='formFormat') render(); },
  async add(){

    const draft={ name:state.formName.trim(), url:state.formUrl.trim(), type:state.formType, format:state.formFormat, priority:state.formPriority };
    state.sourceSync={...state.sourceSync,busy:true,message:'正在写入飞书…'};

      state.sourceSync={status:'connected',connected:true,busy:false,message:'已添加，状态为「待测」，诊断通过后再启用'};
    } catch(error) {
      state.sourceSync={status:'error',connected:true,busy:false,message:`添加失败 · ${error.message}`};
    }
    render();
  },
};

    .map(s=>({ date:s.date, title:s.zhTitle, desc:s.summary.slice(0,90)+'…', ref:s.rank }));

function strategyMapHtml(strategy, events, A){
  if(!strategy || !strategy.overview) return '';
  const eventMap=Object.fromEntries(events.map(event=>[event.id,event]));
  const themeMap=Object.fromEntries((strategy.themes||[]).map(theme=>[theme.id,theme]));
  const hypotheses=(strategy.hypotheses||[]);
  const rows=hypotheses.map(hypothesis=>{
    const evidence=(hypothesis.evidenceEventIds||[]).map(id=>eventMap[id]).filter(Boolean).slice(0,4);
    const themes=(hypothesis.themeIds||[]).map(id=>themeMap[id]).filter(Boolean);
    const confidence=Number(hypothesis.confidence||0);
    return `<div class="strategy-flow strategy-row">
      <div class="strategy-col"><div class="strategy-spine">${evidence.map(event=>{ const original=(event.originals||[]).find(item=>item.url); const title=esc(event.title.replace(/^〔[^〕]+〕/,'')); const inner=`<span class="strategy-node-date">${esc(event.date)}</span><span class="strategy-node-title strategy-clamp strategy-clamp-2">${title}</span>${original?'<span class="strategy-node-link">原文 ↗</span>':'<span></span>'}`; return original?`<a class="strategy-node" href="${esc(original.url)}" target="_blank" rel="noopener" title="打开代表原文：${esc(original.title)}">${inner}</a>`:`<div class="strategy-node">${inner}</div>`; }).join('')}</div></div>
      <div class="strategy-arrow" aria-hidden="true"></div>
      <div class="strategy-col">${themes.map(theme=>`<div class="strategy-para"><div class="strategy-para-inner"><div class="strategy-para-name">${esc(theme.name)}</div><div class="strategy-para-body">${esc(theme.summary)}</div></div></div>`).join('')}</div>
      <div class="strategy-arrow" aria-hidden="true"></div>
      <div class="strategy-col">
        <div class="strategy-result"><div class="strategy-result-inner">
          <div style="display:flex;align-items:flex-start;gap:8px;"><div class="strategy-result-title">${esc(hypothesis.title)}</div><span style="flex:none;font-family:'Geist Mono',monospace;font-size:10px;color:${scoreColor(confidence)};">置信度 ${confidence}</span></div>
          <div class="strategy-result-body">${esc(hypothesis.assessment)}</div>
          ${hypothesis.counterSignals||(hypothesis.watchFor||[]).length?`<details class="strategy-details"><summary>反证与后续观察</summary><div class="strategy-counter">${hypothesis.counterSignals?`<div class="strategy-counter-block"><strong>可能反证</strong><div class="strategy-watch"><span>${esc(hypothesis.counterSignals)}</span></div></div>`:''}${(hypothesis.watchFor||[]).length?`<div class="strategy-counter-block"><strong>继续观察</strong><div class="strategy-watch">${hypothesis.watchFor.map(item=>`<span>${esc(item)}</span>`).join('')}</div></div>`:''}</div></details>`:''}
        </div></div>
      </div>
    </div>`;
  }).join('');
  const relations=(strategy.relations||[]).map(relation=>{
    const from=eventMap[relation.fromEventId],to=eventMap[relation.toEventId];
    if(!from||!to) return '';
    return `<div class="strategy-relations-row"><span>${esc(from.date)} → ${esc(to.date)}</span><span>${esc(from.title.replace(/^〔[^〕]+〕/,''))}</span><span class="strategy-relations-label">${esc(relation.label)} →</span><span>${esc(to.title.replace(/^〔[^〕]+〕/,''))}</span></div>`;
  }).filter(Boolean).join('');
  return `<section class="strategy-map">
    <div class="strategy-map-head"><h2>长期布局研判</h2><span>假设均由下方事件证据支持，不等同于已确认事实</span></div>
    <p class="strategy-map-overview">${esc(strategy.overview)}</p>
    ${rows?`<div class="strategy-flow strategy-flow-head"><span>事件证据</span><span></span><span>战略主题</span><span></span><span>潜在布局意图</span></div><div class="strategy-rows">${rows}</div>`:''}
    ${relations?`<details class="strategy-relations"><summary>查看跨事件关系</summary><div style="display:flex;flex-direction:column;gap:8px;margin-top:10px;">${relations}</div></details>`:''}
  </section>`;
}

// 精编小标题格式为「中文 || 原文」。存量解读只有英文标题，此时先照原样显示，
// 等 daily 重新生成后自然补上中文。
function splitBilingualHeading(raw){
  const text = String(raw||'').trim();
  const parts = text.split(/\s*(?:\|\||｜)\s*/).map(p=>p.trim()).filter(Boolean);
  if(parts.length < 2) return [text, ''];
  const [first, ...rest] = parts;
  const second = rest.join(' ');
  return first===second ? [first, ''] : [first, second];
}

  { re: /Qualcomm|Snapdragon|高通|NPU/i,    t: 'Q',   bg: '#0e1a3a', color: '#7ea2ff', domain: 'qualcomm.com' },

const IMG = id => `https://images.unsplash.com/photo-${id}?w=640&h=480&fit=crop&q=72&auto=format`;
const IMAGE_BY_RANK = {
  3:  IMG('1677442136019-21780ecad995'), // Claude Sonnet 5 · 前沿模型
  4:  IMG('1461749280684-dccba630e2f6'), // Gemma 4 开源 · 代码

  8:  IMG('1555617981-dac3880eac6e'),    // AMD MI350X · 芯片
  9:  IMG('1639322537228-f710d846310a'), // A2A 网关 · 网络

  15: IMG('1460925895917-afdab827c52f'), // 采用报告 · 数据面板

  18: IMG('1556656793-08538906a9f8'),    // 语音克隆诈骗 · 来电
  19: IMG('1631624215749-b10b3dd7bca7'), // 高通端侧 NPU · 晶圆
  20: IMG('1592286927505-1def25115558'), // Apple 端侧 · 手机
  21: IMG('1551288049-bebda4e38f71'),    // Gemma 4 视频实测 · 屏幕
};
function topicImageUrl(s){
  if(s.image) return s.image;
  if(!s.recordId && IMAGE_BY_RANK[s.rank]) return IMAGE_BY_RANK[s.rank];
  const hay = `${s.zhTitle} ${s.title} ${s.tags.join(' ')} ${s.cat}`;
  // 仅以真实场景摄影兜底；同一主题准备多张，并按标题稳定分散。
  const map = [
    [/机器人|robot|LeRobot/i,['1485827404703-89b55fcc595e','1535378917042-10a22c95931a']],
    [/汽车|车辆|automotive|vehicle|SDV/i,['1503376780353-7e6692767b70','1492144534655-ae79c964c9d7']],
    [/GPU|NVIDIA|AMD|算力|token|HBM|芯片/i,['1591405351990-4726e331f141','1518770660439-4636190af475']],
    [/端侧|手机|NPU|Apple/i,['1510557880182-3d4d3cba35a5','1511707171634-5f897ff02aa9']],
    [/隐私|PII|安全|诈骗|深伪|诉讼|监管/i,['1550751827-4bd374c3f58b','1563013544-824ae1b704d3']],
    [/RAG|数据库|向量|记忆/i,['1544197150-b99a580bb7a8','1558494949-ef010cbdcc31']],
    [/开源|模型|LLM|Bedrock|SageMaker/i,['1518770660439-4636190af475','1516321318423-f06f85e504b3']],
  ];
  const hash = [...hay].reduce((n,ch)=>((n*31)+ch.charCodeAt(0))>>>0, 0);
  for(const [re,ids] of map){ if(re.test(hay)) return IMG(ids[hash % ids.length]); }
  return IMG(['1558494949-ef010cbdcc31','1461749280684-dccba630e2f6'][hash % 2]);
}

// 右栏两块看板。深色终端风,数字在黑底上更跳,和左边浅色信息流拉开层次。
// 窄栏只放「名次 / 名字 / 一个数」这种一眼能扫的量,吞吐、单价、市值这些
// 需要横向对比的列放不下也不该硬塞——挤成三号字反而谁都不看。
function dataRailHtml(A){
  const mono = "'Geist Mono', ui-monospace, Menlo, monospace";
  const TXT = '#faf7f0', DIM = '#8f887a', LINE = 'rgba(255,255,255,.10)';
  // 涨绿跌红是欧美惯例,中文财经反过来:这里跟 A 股读者的直觉走
  const UP = '#ff5f52', DOWN = '#34d399';
  const num = (v, digits) => (v===null || v===undefined || v==='') ? '—' : Number(v).toFixed(digits);
  const pctColor = p => (p===null || p===undefined) ? DIM : (p>0 ? UP : p<0 ? DOWN : TXT);
  // 行情行 hover 会翻成白底，涨跌色得同时给一份深色版，否则白底上读不出来
  const pctColorOnLight = p => (p===null || p===undefined) ? '#6b6459' : (p>0 ? '#c0392b' : p<0 ? '#0f7a53' : '#16130f');

  // 外网 favicon 在国内经常打不开，已知厂商用仓库里的 SVG；其余再试 Google，最后才露字标。
  // Google 那条兜底还会返回错东西——ibm.com 给的是 Adobe CMS 的占位机器人图，
  // 所以榜上出得来的厂商一律在这里备一份官网原文件，别指望第三方代理。
  const LOGO_ASSET = {
    'anthropic.com': 'data/logos/anthropic.svg?v=4',
    'openai.com': 'data/logos/openai.svg?v=4',
    'x.ai': 'data/logos/x.svg?v=4',
    'meta.com': 'data/logos/meta.svg?v=4',
    'google.com': 'data/logos/google.svg?v=4',
    'nvidia.com': 'data/logos/nvidia.svg?v=4',
    'qwen.ai': 'data/logos/qwen.svg?v=4',
    'moonshot.cn': 'data/logos/kimi.svg?v=4',
    'z.ai': 'data/logos/zai.svg?v=4',
    'ibm.com': 'data/logos/ibm.svg?v=4',
    'microsoft.com': 'data/logos/microsoft.svg?v=4',
    'mistral.ai': 'data/logos/mistral.svg?v=4',
    'liquid.ai': 'data/logos/liquid.svg?v=4',
    'openbmb.cn': 'data/logos/openbmb.svg?v=4',
    // 南北阁只发了位图 logo（自家 HF 仓库的 figures/nbg.png），没有矢量原件
    'nanbeige.com': 'data/logos/nanbeige.png?v=4',
  };
  // 只在 GitHub / HF 发模型、连域名都没有的实验室，按厂商名认 logo——
  // 与其编一个注定解析不了的域名当 key，不如承认这里没有域名。
  const LOGO_BY_CREATOR = {
    'AI9Stars': 'data/logos/ai9stars.svg?v=4',
  };
  const logoChip = (domain, fallback, size) => {
    const local = LOGO_ASSET[domain] || LOGO_BY_CREATOR[fallback] || '';
    const src = local || (domain ? `https://www.google.com/s2/favicons?sz=128&domain=${esc(domain)}` : '');
    const letters = esc(String(fallback||'?').slice(0,2));
    const inner = src
      ? `<img src="${src}" alt="" loading="lazy" referrerpolicy="no-referrer" data-domain="${esc(domain)}" data-fb="${letters}" onerror="App.logoFallback(this)" style="width: ${size-4}px; height: ${size-4}px; object-fit: contain; display: block;">`
      : `<span class="logo-fb">${letters}</span>`;
    return `<span class="aa-logo" style="flex: none; width: ${size}px; height: ${size}px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; overflow: hidden; background: #fff; color: #16130f; font-family: ${mono}; font-size: ${Math.round(size*0.42)}px; font-weight: 700;">${inner}</span>`;
  };

  const empty = msg => `<p style="margin: 0; padding: 26px 14px; text-align: center; font-family: ${mono}; font-size: 11.5px; line-height: 1.7; color: ${DIM};">${esc(msg)}</p>`;

  // 看板缺数据要明说是哪一块、为什么,留白会让停更看起来像正常状态
  const boardBody = (board, label, rows, build) => {
    if(dashboardStatus.loading) return empty('LOADING…');
    if(dashboardStatus.error) return empty(`看板数据加载失败（${dashboardStatus.error}）`);
    if(!board) return empty(`暂无${label}数据`);
    if(board.error) return empty(`暂无${label}数据：${board.error}`);
    if(!rows.length) return empty(`暂无${label}数据`);
    return build();
  };

  const board = (title, time, body, titleHref, nav) => `
    <section style="position: relative; background: #0a0a0a; border: 1.5px solid var(--ds-ink-line); box-shadow: 5px 5px 0 rgba(22,19,15,.10); overflow: hidden;">
      <div style="height: 3px; background: ${A.accent};"></div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 11px 14px; border-bottom: 1px solid ${LINE};">
        <span style="width: 6px; height: 6px; background: ${A.accent}; transform: rotate(45deg); flex: none;"></span>
        ${titleHref
          ? `<a href="${esc(titleHref)}" target="_blank" rel="noopener" style="font-size: 13.5px; font-weight: 700; color: ${TXT};">${esc(title)}</a>`
          : `<span style="font-size: 13.5px; font-weight: 700; color: ${TXT};">${esc(title)}</span>`}
        <span style="margin-left: auto; font-family: ${mono}; font-size: 9px; letter-spacing: .08em; color: ${DIM};">${esc(time || '—')}</span>
      </div>
      ${nav || ''}
      ${body}
    </section>`;

  const lb = dashboard.leaderboard;
  const hf = dashboard.hfTrending;
  // 参数规模不占独立一列,当成小字或 hover 补充信息:窄栏再加一列数字就没法扫了
  const paramText = v => (v===null || v===undefined || v==='') ? '' : `${Number(v).toFixed(2).replace(/\.?0+$/,'')}B`;
  // 下载量和点赞动辄六七位,tooltip 里收成 k/M
  const countText = v => {
    if(v===null || v===undefined || v==='') return '';
    const n = Number(v);
    if(n >= 1e6) return `${(n/1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/,'')}M`;
    if(n >= 1e3) return `${(n/1e3).toFixed(n >= 1e4 ? 0 : 1).replace(/\.0$/,'')}k`;
    return String(n);
  };

  // 四张榜共用一套行:名次 + logo + 「名字格」,指标填进名字格的背景。一根条和一行字

  // (末位→榜首)铺开,用 0 或 100 做基准时前 12 名只差几分,所有行会填成一样长。
  const rankRows = (rows, metricOf, cellOf) => {
    const scores = rows.map(r => metricOf(r) || 0);
    const hi = Math.max(...scores), lo = Math.min(...scores);

          <span style="position: absolute; left: 0; top: 0; bottom: 0; width: ${fillWidth(metricOf(r))}%; background: linear-gradient(90deg, color-mix(in srgb, ${A.accent} 78%, transparent), color-mix(in srgb, ${A.accent} 26%, transparent));"></span>
          <span title="${esc(c.full)}" style="position: relative; min-width: 0; font-size: 12.5px; font-weight: 650; color: ${TXT}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${esc(r.name)}</span>
          ${c.tag ? `<span class="aa-tag${c.sizeTag ? ' is-size' : ''}" title="${esc(c.full)}">${esc(c.tag)}</span>` : ''}
          <span title="${esc(c.hint)}" style="position: relative; margin-left: auto; font-family: ${mono}; font-size: 11.5px; font-weight: 700; color: ${TXT}; font-variant-numeric: tabular-nums;">${c.value}</span>
        </span>
      </div>`;
    }).join('')}</div>`;
  };

  const aaHome = 'https://artificialanalysis.ai/';
  const aaMetric = (lb && lb.metric) || '智能指数';
  const aaCell = m => ({
    owner: m.creator,
    full: m.label || m.variant || m.name,
    tag: m.tag || '',
    value: num(m.intelligence, 1),
    hint: `${aaMetric} ${num(m.intelligence,1)}${paramText(m.params) ? ` · ${paramText(m.params)} 参数` : ''}`,
  });
  // HF 那一榜里模型名已经带组织前缀(zai-org/GLM-5.3),logo 说清了归属就只留仓库名;
  // 参数规模比组织名更值得占小字位——同名模型的差别常常就在规模。
  const hfCell = m => ({
    owner: m.org,

      countText(m.downloads) ? `${countText(m.downloads)} 下载` : '',
      m.inference ? '已接推理服务' : '',

  });

  // 总榜、两张按参数规模分档的开源榜,加一张 HF 社区热度榜。同一块看板切页而不是
  // 并排四块:四块占满整条右栏,行情和热力图就被挤到首屏之外了。AA 答的是「哪个
  // 模型更强」,HF 答的是「社区这几天在下载谁」,同一块里换个指标看。
  const aaPages = [{
      key: 'overall', label: '综合', hint: '全部模型 · 智能指数', noun: '榜单',
      board: lb, source: 'Artificial Analysis', home: aaHome,
      metric: aaMetric, metricOf: m => m.intelligence, cell: aaCell,
    }]
    // 老快照没有 buckets / hfTrending,缺的那几页就不出现
    .concat(((lb && lb.buckets) || []).map(b => ({
      key: b.key, label: b.note || b.label, hint: `${b.label} · ${b.note} 开源模型`,
      noun: `${b.note || b.label}榜单`,
      board: b, source: 'Artificial Analysis', home: aaHome,
      metric: aaMetric, metricOf: m => m.intelligence, cell: aaCell,
    })))
    .concat(hf ? [{
      key: 'hf', label: '热度', hint: 'Hugging Face · 社区下载与点赞趋势',
      noun: 'Hugging Face 热度',
      board: hf, source: 'Hugging Face', home: 'https://huggingface.co/models',
      metric: hf.metric || '热度分', metricOf: m => m.trending, cell: hfCell,
    }] : []);
  const aaPage = aaPages.find(p => p.key === state.leaderboardTab) || aaPages[0];
  const aaBoard = aaPage.board;
  const models = (aaBoard && aaBoard.models) || [];

  const arenaBody = boardBody(aaBoard, aaPage.noun, models,
    () => rankRows(models, aaPage.metricOf, aaPage.cell));

  // 只有一页时不显示切页条
  const aaNav = aaPages.length > 1 ? `
    <nav class="aa-tabs" aria-label="模型榜单">
      ${aaPages.map(p => `<button type="button" class="${p.key===aaPage.key?'on':''}" title="${esc(p.hint)}" onclick="App.setLeaderboardTab('${esc(p.key)}')">${esc(p.label)}</button>`).join('')}
    </nav>` : '';

  const mk = dashboard.market;
  const quotes = (mk && mk.quotes) || [];
  const quoteName = q => {
    const raw = String(q.name || '').trim();
    if(raw==='Meta Platforms' || /^Meta\s+Platform/i.test(raw)) return 'Meta';
    if(raw==='Snowflake Inc.' || /^Snowflake/i.test(raw)) return 'Snowflake';
    if(/^MINIMAX/i.test(raw)) return 'MiniMax';
    return raw.replace(/-[UW]$/, '').replace(/\s+Inc\.?$/i, '');
  };
  const quoteHref = q => {
    const code = String(q.code || '');
    const prefix = code.slice(0, 2).toLowerCase();
    const rest = code.slice(2);
    if(!rest) return '';
    if(prefix === 'us') return `https://www.nasdaq.com/market-activity/stocks/${rest.toLowerCase()}`;
    if(prefix === 'sh') return `https://www.sse.com.cn/assortment/stock/list/info/company/index.shtml?COMPANY_CODE=${rest}`;
    if(prefix === 'sz') return `https://www.szse.cn/certificate/individual/index.html?code=${rest}`;
    if(prefix === 'hk') return `https://www.hkex.com.hk/Market-Data/Securities-Prices/Equities/Equities-Quote?sc_lang=zh-HK&sym=${rest.replace(/^0+/, '') || rest}`;
    return q.url || '';
  };
  const quoteRow = q => {
    const pct = q.changePct;
    const color = pctColor(pct);
    const sign = pct>0 ? '+' : '';
    const href = quoteHref(q);
    const inner = `
        <span class="quote-name" style="min-width: 0; font-size: 12px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${esc(quoteName(q))}</span>
        <span class="quote-pct" style="font-family: ${mono}; font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums; --pct: ${color}; --pct-light: ${pctColorOnLight(pct)};">${sign}${num(pct,2)}%</span>`;
    return href
      ? `<a class="quote-row" href="${esc(href)}" target="_blank" rel="noopener" title="${esc(quoteName(q))}">${inner}</a>`
      : `<div class="quote-row">${inner}</div>`;
  };
  const quoteGroup = (label, rows) => rows.length ? `
    <div style="min-width: 0;">
      <div style="padding: 8px 8px 4px; font-family: ${mono}; font-size: 9px; letter-spacing: .14em; color: ${DIM};">${esc(label)}</div>
      ${rows.map(quoteRow).join('')}
    </div>` : '';
  const marketBody = boardBody(mk, '行情', quotes, () => {
    const us = quotes.filter(q => q.market === '美股');
    const cn = quotes.filter(q => q.market !== '美股');
    return `<div style="display: grid; grid-template-columns: 1fr 1fr; min-width: 0;">${quoteGroup('美股', us)}${quoteGroup('中资', cn)}</div>`;
  });

  const stamp = b => {
    if(!b) return '—';
    const clock = b.updatedAt ? b.updatedAt.slice(11,16) : '';
    if(b.live) return clock ? `实时 ${clock}` : '实时';
    return b.updatedAt ? b.updatedAt.slice(5,16).replace('T',' ') : '—';
  };
  // 标题和署名跟着当前页走:HF 那一页挂在「Artificial Analysis」标题下就是署错了源,
  // 而 AA 的条款要求页面署名并链回它自己的站。
  const aaStamp = (() => {
    const when = stamp(aaBoard);
    return when && when !== '—' ? `${aaPage.metric} · ${when}` : aaPage.metric;
  })();

  return `
  <aside class="feed-data">
    ${heatmapHtml(A)}
    ${board(aaPage.source, aaStamp, arenaBody, (aaBoard&&aaBoard.sourceUrl)||aaPage.home, aaNav)}
    ${board('AI 概念股', stamp(mk), marketBody)}
  </aside>`;
}

// 右栏最上：话题热度。黑底看板与下面两块同一套壳。
function heatmapHtml(A){
  const TXT = '#faf7f0', DIM = '#8f887a', LINE = 'rgba(255,255,255,.10)';
  const days = heatmap.days || [];
  const labels = heatmap.labels || {};
  const trends = heatmap.trend || {};
  const rawM = (heatmap.matrix && heatmap.matrix.raw) || [];
  const normM = (heatmap.matrix && heatmap.matrix.normalized) || [];
  const src = heatmap.source === 'x' ? 'x' : 'google-trends';
  const ordered = (heatmap.topics || []).slice().sort((a,b)=> (Number(trends[b])||0) - (Number(trends[a])||0));
  const topicIdx = {};
  (heatmap.topics || []).forEach((t,i)=>{ topicIdx[t]=i; });

  const heatStops = [[255,255,255],[176,204,242],[43,99,196],[14,36,96]];
  const heatMix = (v)=>{
    const t = Math.max(0, Math.min(1, Number(v)||0));
    const n = heatStops.length - 1;
    const x = t * n;
    const i = Math.min(n - 1, Math.floor(x));
    const u = x - i;
    return heatStops[i].map((c,k)=>Math.round(c + (heatStops[i+1][k]-c)*u));
  };
  const heatColor = (v)=> { const c = heatMix(v); return `rgb(${c[0]},${c[1]},${c[2]})`; };
  const heatInk = (v)=>{
    const c = heatMix(v);
    return (0.299*c[0] + 0.587*c[1] + 0.114*c[2]) > 160 ? '#16130f' : '#faf7f0';
  };
  const globalPeak = Math.max(1, ...rawM.flat().map(Number));

  const todayIso = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Shanghai' }).format(new Date());
  const dayHead = days.map(d=>{
    const isToday = d === '今天' || d === todayIso;
    let short = '今';
    if(!isToday){
      const m = String(d).match(/(?:^|-)(\d{1,2})$/);
      short = m ? String(Number(m[1])) : String(d);
    }
    return `<th scope="col" title="${esc(d)}">${esc(short)}</th>`;
  }).join('');

  const rows = ordered.map(topic=>{
    const i = topicIdx[topic];
    const tr = Number(trends[topic]||0);
    const breakouts = heatmap.breakouts || [];
    const hasBreakouts = Array.isArray(breakouts) && breakouts.length;
    const isBreakout = hasBreakouts && breakouts.includes(topic);
    const badge = isBreakout ? '🔥' : (!hasBreakouts && tr > 1.5 ? '🔥' : (tr < 0.5 ? '❄️' : ''));
    const cells = days.map((day, j)=>{
      const raw = (rawM[i] && rawM[i][j]) || 0;
      const norm = (normM[i] && normM[i][j]) || 0;
      const intensity = raw / globalPeak;
      const on = state.heatmapPick && state.heatmapPick.topic===topic && state.heatmapPick.day===day;
      const tArg = JSON.stringify(topic);
      const dArg = JSON.stringify(day);
      return `<td><button type="button" class="heat-cell${on?' is-on':''}" style="background:${heatColor(intensity)};color:${heatInk(intensity)}"
        aria-label="${esc(labels[topic]||topic)} ${esc(day)} ${raw}"
        onmouseenter="App.showHeatTip(event,${tArg},${dArg},${raw},${Number(norm)||0})"
        onmouseleave="App.hideHeatTip()"
        onclick="App.pickHeatmapCell(${tArg},${dArg},event)"></button></td>`;
    }).join('');
    const mark = (heatmap.marks && heatmap.marks[topic]) || '🌐';
    const scope = (heatmap.scopes && heatmap.scopes[topic]) || (mark==='🌐'?'global':'country');
    const markTitle = scope==='country' ? '上榜国家近 7 日' : '全球近 7 日';
    const newsQ = heatNewsQuery(topic);
    const newsUrl = heatNewsUrl(topic);
    return `<tr>
      <th scope="row"><a class="heat-news" href="${esc(newsUrl)}" target="_blank" rel="noopener noreferrer" title="Google 搜索：${esc(newsQ)}"><span class="heat-mark">${mark}</span><span class="heat-topic">${esc(labels[topic]||topic)}</span></a>${badge?`<span class="heat-badge" title="${isBreakout?'破线入选 · ':''}今日 / 近6日均 ${tr.toFixed(2)}">${badge}</span>`:''}</th>
      ${cells}
    </tr>`;
  }).join('');

  let panel = '';
  const pick = state.heatmapPick;
  if(pick){
    const key = pick.topic + '|' + pick.day;
    const ids = (heatmap.items && heatmap.items[key]) || [];
    const extra = heatmap.itemIndex || {};
    const cards = ids.map(id=>{
      const s = extra[id] || {};
      return `<a class="heat-hit" href="${esc(s.url||'#')}" target="_blank" rel="noopener">${esc(s.title||id)}${s.source?`<span class="src">${esc(s.source)}</span>`:''}</a>`;
    }).join('');
    panel = `<div class="heat-panel">
      <div class="heat-panel-h">${esc(labels[pick.topic]||pick.topic)} · ${esc(pick.day)}
        <button type="button" class="heat-x" onclick="state.heatmapPick=null;render()">关闭</button>
      </div>
      <div class="heat-hits">${cards || '<div class="heat-empty">该格暂无条目</div>'}</div>
    </div>`;
  }

  const legend = heatStops.map((_, i) => `<i style="background:${heatColor(i / (heatStops.length - 1))}"></i>`).join('');
  const srcError = heatmap.error || '';
  const hasValues = rawM.flat().some(v => Number(v));
  const toggle = `
    <div class="heat-toggle" role="group" aria-label="热搜来源">
      <button type="button" class="${src==='google-trends'?'on':''}" onclick="App.setHeatmapSource('google-trends')">Google</button>
      <button type="button" class="${src==='x'?'on':''}" onclick="App.setHeatmapSource('x')">X</button>
    </div>`;
  const status = srcError
    ? `<p class="heat-status">${hasValues ? esc(srcError) : `暂无数据：${esc(srcError)}`}</p>`
    : '';
  const grid = days.length && (hasValues || !srcError) ? `
    <div class="heat-legend"><span>低</span>${legend}<span>高</span><span style="margin-left:auto;">近 7 日</span></div>
    <div class="heat-scroll" onscroll="App.hideHeatTip()">
      <table class="heat-table">
        <thead><tr><th scope="col"></th>${dayHead}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${panel}
    <div id="heatTip" class="heat-tip" hidden></div>` : '';
  const body = `${toggle}${status}${grid || (!srcError ? `<p class="heat-status">暂无热度数据</p>` : '')}`;

  return `
    <section style="position: relative; background: #0a0a0a; border: 1.5px solid var(--ds-ink-line); box-shadow: 5px 5px 0 rgba(22,19,15,.10); overflow: hidden;">
      <div style="height: 3px; background: ${A.accent};"></div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 11px 14px; border-bottom: 1px solid ${LINE};">
        <span style="width: 6px; height: 6px; background: ${A.accent}; transform: rotate(45deg); flex: none;"></span>
        <span style="font-size: 13.5px; font-weight: 700; color: ${TXT};">话题热度</span>
        <span style="font-size: 10px; color: ${DIM};">${heatmapStatus.demo ? '演示' : 'Google 热搜 · AI'}</span>
        <span style="margin-left: auto; font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 9px; letter-spacing: .14em; color: ${DIM};">TOPIC HEAT</span>
      </div>
      ${body}
    </section>`;
}

        <div class="nav-group">
          ${FORMAT_FILTERS.map(f => navItem(f, !counts[f])).join('')}

      </div>
    </div>
  </aside>`;

function briefHtml(A){
  const mono = "'Geist Mono', ui-monospace, Menlo, monospace";

  const bullets = briefMeta.bullets || [];
  const pointsHtml = (bullets.length ? bullets : (briefMeta.intro ? [{ title: briefMeta.title, text: briefMeta.intro, refs: [] }] : [])).map((b) => {
    const firstRef = (b.refs && b.refs[0]) || 0;

    const imgUrl = s ? topicImageUrl(s) : '';
    const tp = s ? topicFor(s) : { t: 'AI', bg: '#111', color: '#2458b5' };

function youtubeEmbedSrc(embed, autoplay){
  const raw = String(embed || '');
  const id = (raw.match(/youtube(?:-nocookie)?\.com\/embed\/([^?/#]+)/i) || [])[1];
  if(!id) return raw;
  const params = new URLSearchParams({ rel:'0', playsinline:'1', enablejsapi:'1', origin: location.origin });
  if(autoplay) params.set('autoplay', '1');
  return `https://www.youtube-nocookie.com/embed/${id}?${params}`;
}
function bindYoutubeMessages(){
  if(bindYoutubeMessages.bound) return;
  bindYoutubeMessages.bound = true;
  window.addEventListener('message', ev=>{
    if(!/^https:\/\/www\.youtube(?:-nocookie)?\.com$/.test(ev.origin)) return;
    let data = ev.data;
    if(typeof data==='string'){ try{ data=JSON.parse(data); }catch{ return; } }
    if(!data || !['onReady','infoDelivery','initialDelivery'].includes(data.event)) return;
    document.querySelectorAll('[data-yt-waiting] iframe').forEach(frame=>{
      if(frame.contentWindow!==ev.source) return;
      const host = frame.parentElement;
      if(!host) return;
      host.removeAttribute('data-yt-waiting');
      const status = host.querySelector('[data-yt-status]');
      if(status) status.remove();
    });
  });
}

// 事件聚合:优先用后端同事件聚类结果；否则按标题近似在当前简报内兜底
function titleSim(a, b){
  const norm = t => String(t||'').toLowerCase().replace(/[^\w\u4e00-\u9fff]+/g,'').replace(/(独家|详解|速递|刚刚|突发|重磅|报道)/g,'');
  const x = norm(a), y = norm(b);
  if(!x || !y) return 0;
  if(x===y) return 1;
  const max = Math.max(x.length, y.length);
  let hit = 0;
  const gram = s => {
    const out = new Set();
    for(let i=0;i<s.length-1;i++) out.add(s.slice(i,i+2));
    return out;
  };
  const A = gram(x), B = gram(y);
  A.forEach(g=>{ if(B.has(g)) hit++; });
  const union = A.size + B.size - hit;
  return union ? hit/union : 0;
}

      items: (g.items||[]).filter(it=>it && it.url).map(it=>({
        who: it.source || it.who || '来源',
        txt: it.text || `${esc(it.title||'')} —— ${esc(it.note||'同事件报道。')}`,
        url: it.url,
      })),
    })).filter(g=>g.items.length);
  } else {
    const related = signals
      .filter(x=>x.rank!==s.rank && x.url && titleSim(x.zhTitle||x.title, s.zhTitle||s.title) >= 0.82)
      .slice(0,5);
    groups = [
      { key:'官方来源', tone:'#16130f', items:[ { who: s.source, txt:`${esc(s.zhTitle)} —— 原始发布 / 公告。`, url: s.url||sourceUrls[s.source]||'#' } ] },
      { key:'相关报道', tone:'#2b6cb0', items:related.slice(0,2).map(x=>({ who:x.source, txt:`${esc(x.zhTitle)} —— 同事件的其它源头报道。`, url:x.url })) },
      { key:'交叉验证', tone:'#1f7a45', items:related.slice(2,4).map(x=>({ who:x.source, txt:`${esc(x.zhTitle)} —— 可用于交叉印证事实与影响边界。`, url:x.url })) },
      { key:'补充视角', tone:'#a06600', items:related.slice(4,5).map(x=>({ who:x.source, txt:`${esc(x.zhTitle)} —— 补充同事件的背景或旁证。`, url:x.url })) },
    ].filter(group=>group.items.length);
  }
  const n = groups.reduce((sum, group)=>sum+group.items.length, 0);
  if(!n){
    return `<div style="margin: 6px 0 26px; padding: 14px 16px; border: 1px dashed var(--ds-ink-line); color: ${UI.text3}; font-size: 13px;">暂无其它同源报道可聚合。新简报生成后，同事件的其它源头会自动出现在这里。</div>`;
  }
  const blocks = groups.map(g=>`
    <div style="border: 1px solid var(--ds-ink-line); border-left: 3px solid ${g.tone}; background: #fff; margin-bottom: 10px;">
      <div style="display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--ds-hair); background: rgba(22,19,15,.02);">
        <span style="font-size: 12.5px; font-weight: 700; color: ${g.tone};">${g.key}</span>
        <span style="font-size: 10.5px; font-family: 'Geist Mono', monospace; color: ${UI.text3};">${g.items.length}</span>
      </div>
      ${g.items.map(it=>`<div style="display: flex; gap: 9px; padding: 9px 12px; border-top: 1px solid rgba(22,19,15,.05);">
        ${avatarHtml(it.who)}
        <div style="min-width: 0;">
          <a href="${esc(it.url)}" target="_blank" rel="noopener" style="font-size: 12px; font-weight: 700; color: ${UI.text}; text-decoration: underline; text-decoration-style: dashed; text-underline-offset: 3px;">${esc(it.who)} ↗</a>
          <div style="font-size: 12.5px; line-height: 1.6; color: ${UI.text2};">${it.txt}</div>
        </div>
      </div>`).join('')}
    </div>`).join('');
  return `
  <div style="margin: 6px 0 26px;">
    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px;">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: .06em; color: #fff; background: ${A.accent}; padding: 4px 10px; font-family: 'Geist Mono', monospace;">事件聚合</span>
      <span style="font-size: 12.5px; color: ${UI.text2};">本事件聚合 <strong style="color:${UI.text};">${n}</strong> 个可追溯来源 · 点击来源名称打开对应原文</span>
    </div>

}

// 把正文切成段落:优先用原文自带的空行;老数据被抹平过,按句子聚合成段
function splitParagraphs(text){
  const raw = String(text||'').trim();
  if(!raw) return [];
  // 段内的单换行要留着:原文表格就是靠它逐行保存的
  const byBlank = raw.split(/\n{2,}/).map(x=>x.trim()).filter(Boolean);
  if(byBlank.length > 1) return byBlank;
  const byLine = raw.split(/\n/).map(x=>x.trim()).filter(Boolean);
  if(byLine.length > 1) return byLine;
  const cjk = (raw.match(/[\u4e00-\u9fff]/g) || []).length / raw.length > 0.15;
  const limit = cjk ? 170 : 340;
  const sentences = raw.split(/(?<=[。！？!?；;])\s*|(?<=\.)\s+(?=[A-Z])/).filter(Boolean);
  const out = [];
  let buf = '';
  sentences.forEach(sen=>{
    buf += sen;
    if(buf.length >= limit){ out.push(buf.trim()); buf = ''; }
  });
  if(buf.trim()) out.push(buf.trim());
  return out.length ? out : [raw];
}

// 原文表格在正文里按「单元格 | 单元格」逐行保存,还原成表格才对得上行列
function tableBlockHtml(block){
  const lines = String(block||'').split('\n').filter(x=>x.trim());
  if(lines.length < 2 || !lines.every(line=>line.includes('|'))) return '';
  const rows = lines.map(line=>line.split('|').map(cell=>cell.trim()));
  const width = rows[0].length;
  if(width < 2 || rows.some(row=>row.length !== width)) return '';
  // 「英语 |」这类语言切换行会被切成整列为空的两列,那不是表格
  for(let col = 0; col < width; col++){
    if(rows.every(row=>!row[col])) return '';
  }
  const cell = (text, head)=>{
    const tag = head ? 'th' : 'td';
    const extra = head ? `font-weight:700; background:${UI.chip};` : '';
    return `<${tag} style="padding:9px 12px; border:1px solid ${UI.border}; font-size:13.5px; line-height:1.75; color:${UI.text2}; text-align:left; vertical-align:top; ${extra}">${zhProseHtml(esc(text))}</${tag}>`;
  };
  const body = rows.map((row, index)=>`<tr>${row.map(text=>cell(text, index===0)).join('')}</tr>`).join('');
  return `<div style="margin:22px 0; overflow-x:auto;"><table style="width:100%; border-collapse:collapse; background:#fff;">${body}</table></div>`;
}

const PROSE_CSS = 'font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; letter-spacing:0; word-spacing:0; text-align:left; text-justify:none; word-break:normal; overflow-wrap:break-word;';

// 仅当原图自带说明文字时才显示图注，不再加「原文配图 N」这类编号标签
function figureHtml(s, item){
  return `<figure style="margin:24px 0; border:1px solid ${UI.border}; background:#fff;"><img src="${esc(item.url)}" alt="${esc(item.alt||s.zhTitle)}" loading="lazy" onerror="this.closest('figure').remove()" style="display:block; width:100%; max-height:560px; object-fit:contain;">${item.alt?`<figcaption style="padding:9px 12px; font-size:11.5px; color:${UI.text3};">${esc(item.alt)}</figcaption>`:''}</figure>`;
}

// 正文配图:模型选过图时按小标题就位,否则在段落间均匀铺开
function bodyImagePlacer(s, images, paraCount){
  const llmPlaced = s.mediaAssets?.curatedBy === 'llm';
  let pending = images.slice();
  let placed = 0;
  const step = !llmPlaced && images.length && paraCount
    ? Math.max(1, Math.ceil(paraCount / images.length))
    : 0;
  return {
    step,
    // 小标题名可能与模型记下的写法略有出入,双向包含即算命中
    forHeading(heading){
      const key = String(heading||'').trim();
      if(!llmPlaced || !key) return [];
      const matched = [], rest = [];
      pending.forEach(item=>{
        const h = String(item.afterHeading || item.after_heading || '').trim();
        if(h && (h === key || key.includes(h) || h.includes(key))) matched.push(item);
        else rest.push(item);
      });
      pending = rest;
      return matched;
    },
    next(){ return images[placed] ? images[placed++] : null; },
    rest(){ return llmPlaced ? pending : images.slice(placed); },
  };
}

// 后端给不出正文时退回 AI 解读,详情页不能留白
function verbatimBodyMode(s){
  return !!(s && s.bodyVerbatim && String(s.body||'').trim());
}

// 原文里的 **强调** 是作者自己的排版,照抄时按加粗渲染而不是留下星号
function verbatimProse(text){
  return zhProseHtml(esc(text).replace(/\n/g,'<br>')).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

// 中文媒体与公众号:详情页照抄原文,连各级小标题一起保留,不做任何改写
function verbatimBody(A, s){
  const figure = item => figureHtml(s, item);
  const summary = s.summary
    ? `<div style="margin: 0 0 22px; padding: 12px 14px; background: ${A.accentSoft}; border: 1px solid ${A.accentBorder}; border-left: 3px solid ${A.accent};">
        <div style="font-size: 11px; font-weight: 700; letter-spacing: .04em; color: ${A.accentDeep}; margin-bottom: 7px;">✦ 结论速览</div>
        <div style="font-size: 15px; line-height: 2; color: ${UI.text2}; ${PROSE_CSS}">${zhProseHtml(esc(s.summary))}</div>
      </div>`
    : '';
  const coverUrl = String(s.imageUrl || s.mediaAssets?.cover || '').split('?')[0].toLowerCase();
  const images = (s.mediaAssets?.images || []).filter(item=>{
    if(!item?.url) return false;
    return item.url.split('?')[0].toLowerCase() !== coverUrl;
  }).slice(0,8);
  const videos = s.kind==='视频' ? [] : (s.mediaAssets?.videos || []).filter(item=>item?.embedUrl).slice(0,1);
  const paras = splitParagraphs(s.body);
  if(!paras.length){
    return `${summary}<p style="margin:0 0 18px; font-size:15px; line-height:2; color:${UI.text2}; ${PROSE_CSS}">${zhProseHtml(esc(`${s.source} 的这条内容暂未抓到可展示的正文,可点击下方「阅读原文」查看。`))}</p>${originalLink(A, s)}`;
  }
  const placer = bodyImagePlacer(s, images, paras.length);
  const blocks = [];
  // 原文小标题按层级排版:二级是章节,三级/四级是章节内的分层
  const headingBlock = (level, raw) => {
    const text = esc(String(raw).replace(/\*\*/g, ''));
    if(level >= 4) return `<h4 style="margin:26px 0 10px; font-size:14.5px; line-height:1.5; font-weight:700; color:${UI.text2};">${text}</h4>`;
    if(level === 3) return `<h3 style="margin:28px 0 12px; padding-bottom:7px; border-bottom:1px solid ${UI.border}; font-size:16.5px; line-height:1.5; color:${UI.text};">${text}</h3>`;
    return `<div style="margin:32px 0 14px; padding:10px 13px; border-left:4px solid ${A.accent}; background:${A.accentFaint};">
      <h2 style="margin:0; font-size:19px; line-height:1.5; letter-spacing:-.01em; color:${UI.text};">${text}</h2>
    </div>`;
  };
  paras.forEach((para, index)=>{
    const heading = para.match(/^(#{2,4})\s+([^\n]+)([\s\S]*)$/);
    if(heading){
      const level = heading[1].length;
      const text = heading[2].trim();
      blocks.push(headingBlock(level, text));
      const trailing = heading[3].trim();
      if(trailing) blocks.push(`<p style="margin:0 0 18px; font-size:15px; line-height:2.08; color:${UI.text2}; ${PROSE_CSS}">${verbatimProse(trailing)}</p>`);
      placer.forHeading(text).forEach(item=> blocks.push(figure(item)));
      return;
    }
    const table = tableBlockHtml(para);
    blocks.push(table || `<p style="margin:0 0 18px; font-size:15px; line-height:2.08; color:${UI.text2}; ${PROSE_CSS}">${verbatimProse(para)}</p>`);
    if(placer.step && (index + 1) % placer.step === 0){
      const item = placer.next();
      if(item) blocks.push(figure(item));
    }
  });
  placer.rest().forEach(item=> blocks.push(figure(item)));
  videos.forEach(item=> blocks.push(`<div style="margin:24px 0;background:#000;">${videoFacadeHtml(item, s.zhTitle, s.url, s.imageUrl)}</div>`));
  const truncated = s.bodyTruncated
    ? `<div style="margin:6px 0 0; padding:10px 13px; border:1px dashed var(--ds-ink-line); font-size:12.5px; color:${UI.text3};">正文按篇幅上限截断,完整内容请见原文。</div>`
    : '';
  return `${summary}${blocks.join('')}${truncated}${originalLink(A, s)}`;
}

// 详情正文只展示 AI 提炼内容与原文配图；原文保留在跳转链接中，不再整篇贴入卡片
function articleBody(A, s){
  if(verbatimBodyMode(s)) return verbatimBody(A, s);
  const proseStyle = PROSE_CSS;
  const P = html => `<p style="margin: 0 0 18px; font-size: 15px; line-height: 2; color: ${UI.text2}; ${proseStyle}">${zhProseHtml(html)}</p>`;
  const figure = item => figureHtml(s, item);

  // 短摘要负责速览，主体使用按内容类型生成的深度解读
  const summary = s.summary || `${s.source} 的这条内容暂未生成摘要，可点击下方「阅读原文」查看。`;
  const summaryLabel = s.kind==='播客' && s.podcastMetrics?.transcript_source === 'official_description'
    ? '官方简介速览 · 非完整转录'

    ? `<div style="margin: 0 0 20px; padding: 12px 14px; background: ${A.accentSoft}; border: 1px solid ${A.accentBorder}; border-left: 3px solid ${A.accent};">

      </div>`
    : '';

  const coverUrl = String(s.imageUrl || s.mediaAssets?.cover || '').split('?')[0].toLowerCase();
  const llmPlaced = s.mediaAssets?.curatedBy === 'llm';
  const images = (s.mediaAssets?.images || []).filter(item=>{
    if(!item?.url) return false;
    return item.url.split('?')[0].toLowerCase() !== coverUrl;
  }).slice(0,6);
  let pendingImages = images.slice();
  const headingOf = item => String(item.afterHeading || item.after_heading || '').trim();
  const takeForHeading = heading => {
    const key = String(heading||'').trim();
    if(!llmPlaced || !key) return [];
    const matched = [];
    const rest = [];
    pendingImages.forEach(item=>{
      const h = headingOf(item);
      if(h && (h === key || key.includes(h) || h.includes(key))) matched.push(item);
      else rest.push(item);
    });
    pendingImages = rest;
    return matched;
  };
  const flushHeading = heading => takeForHeading(heading).forEach(item=>blocks.push(figure(item)));
  const videos = s.kind==='视频' ? [] : (s.mediaAssets?.videos || []).filter(item=>item?.embedUrl).slice(0,1);
  const policy = s.mediaAssets?.policy || {};
  const documents = (s.mediaAssets?.documents || []).filter(item=>item?.url).slice(0,4);
  const deepParas = splitParagraphs(s.deepAnalysis);
  const sourceStructured = s.editorialStructure === 'source';
  const blocks = [];
  const paperFramework = s.kind==='论文' && s.deepAnalysis
    ? `<div style="margin:0 0 24px;padding:14px 16px;border-top:2px solid ${A.accent};border-bottom:1px solid ${UI.border};background:linear-gradient(90deg,${A.accentFaint},#fff);">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;">
          <strong style="font-size:13px;color:${UI.text};">论文解读框架</strong>
          <span style="font-family:'Geist Mono',monospace;font-size:10.5px;color:${UI.text3};">${s.paperFullTextSource==='pdf'?'PDF 全文证据':'摘要证据'}${s.paperPages?` · ${s.paperPages} 页`:''}</span>
        </div>
        <div style="font-size:11.5px;line-height:1.8;color:${UI.text3};">研究问题 → 方法与创新 → 实验结果 → 证据与局限 → 研究意义</div>
      </div>`
    : '';
  const policyFramework = policy.authority==='whitehouse.gov' && s.deepAnalysis
    ? `<div style="margin:0 0 24px;padding:14px 16px;border-top:2px solid ${A.accent};border-bottom:1px solid ${UI.border};background:linear-gradient(90deg,${A.accentFaint},#fff);">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;">
          <strong style="font-size:13px;color:${UI.text};">政策解读框架</strong>
          <span style="font-family:'Geist Mono',monospace;font-size:10.5px;color:${UI.text3};">${esc(policy.stage||'官方发布')} · ${esc(policy.agency||'White House')}</span>
        </div>
        <div style="font-size:11.5px;line-height:1.8;color:${UI.text3};">政策效力 → 核心措施 → 时间表与执行 → AI/产业影响 → 待确认事项</div>
      </div>`
    : '';
  const editorialFramework = sourceStructured && s.deepAnalysis
    ? `<div style="margin:0 0 26px;padding:11px 14px;border-left:3px solid ${A.accent};background:${A.accentFaint};font-size:12px;line-height:1.75;color:${UI.text3};">
        <strong style="color:${UI.text2};">原文结构精编</strong> · 沿用作者的小标题与论证顺序，仅压缩重复和低信息内容

  const imageStep = !llmPlaced && images.length && deepParas.length

    : 0;
  let sectionCount = 0;
  let placedImages = !llmPlaced && sourceStructured && images.length ? 1 : 0;
  deepParas.forEach((para, index)=>{
    const sourceSection = sourceStructured ? para.match(/^##\s+([^\n]+)\n?([\s\S]*)$/) : null;
    const section = para.match(/^【([^】]+)】[：:]?\s*([\s\S]*)$/);
    if(sourceSection){
      sectionCount += 1;
      // 沿用原文小标题时中文在上、原文小标题在下；只有中文时不留空行
      const [headCn, headOriginal] = splitBilingualHeading(sourceSection[1]);
      blocks.push(`<section style="margin:30px 0 32px;">
        <div style="margin:0 0 14px;padding:10px 13px;border-left:4px solid ${A.accent};background:${A.accentFaint};">

          ${headOriginal?`<div style="margin-top:4px;font-size:13px;line-height:1.5;color:${UI.text3};">${esc(headOriginal)}</div>`:''}
        </div>
        ${sourceSection[2].trim()?`<div style="font-size:15px;line-height:2.08;color:${UI.text2};${proseStyle}">${zhProseHtml(esc(sourceSection[2].trim()).replace(/\n/g,'<br>'))}</div>`:''}

      flushHeading(sourceSection[1]);

          <strong style="color:${UI.text2};">资料边界：</strong>${zhProseHtml(esc(section[2].trim()).replace(/\n/g,'<br>'))}
        </aside>`);
      } else {
        sectionCount += 1;
        const sectionNo = String(sectionCount).padStart(2, '0');
        if(s.kind==='论文'){
        blocks.push(`<section style="position:relative;margin:8px 0 30px;padding-left:22px;border-left:2px solid ${A.accentBorder};">
          <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:10px;">
            <span style="font-family:'Geist Mono',monospace;font-size:10.5px;font-weight:800;color:${A.accentDeep};">${sectionNo}</span>

          </div>

      blocks.push(`<div style="margin:14px 0;padding:14px 16px;border-left:4px solid ${A.accent};background:${A.accentFaint};font-size:14.5px;line-height:2;color:${UI.text2};${proseStyle}">${zhProseHtml(esc(para).replace(/\n/g,'<br>'))}</div>`);

      </details>`
    : '';
  const documentLinks = documents.length
    ? `<section style="margin:26px 0 12px;border:1.5px solid var(--ds-ink-line);background:#fff;box-shadow:4px 4px 0 rgba(22,19,15,.06);">

        </a>`).join('')}
      </section>`
    : '';
  return `${lead}${paperFramework}${policyFramework}${editorialFramework}${editorialCover}${blocks.join('')}${evidence}${documentLinks}${originalLink(A, s)}`;

  const emptyHtml = filtered.length===0 ? `<div style="padding: 36px 20px; text-align: center; font-size: 13px; color: ${UI.text3};">${!state.sources.length?'尚未读取到信号源配置':query?`没有匹配「${esc(state.srcQuery)}」的信号源`:'当前筛选组合下没有信号源'}</div>` : '';

        <div class="form-grid" style="display: grid; grid-template-columns: 1.1fr 1fr 1fr 1.5fr .7fr auto; gap: 12px; align-items: end;">

          <div style="display: flex; flex-direction: column; gap: 6px;">

        </div>
      </section>` : ''}

      <div style="padding: 0 4px 6px;">${srcTabsHtml}</div>

      <section class="src-table" style="border: 1px solid ${UI.border}; border-radius: 12px; overflow: hidden; background: ${UI.panel}; position: relative;">
        <div style="display: grid; grid-template-columns: ${grid}; padding: 0 20px; height: 44px; align-items: center; background: rgba(22,19,15,.03); border-bottom: 1px solid ${UI.border}; font-size: 11px; font-weight: 700; letter-spacing: .06em; color: ${UI.text3};">

    </div>
  </main>`;

// 跳转到某条信号详情的引用角标
function refChip(A,r){
  return `<button onclick="App.openDetail(${r})" title="查看 #${r} 信号" style="display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 19px; padding: 0 5px; border: 1px solid ${A.accentBorder}; border-radius: 5px; background: ${A.accentSoft}; color: ${A.accentBright}; font-size: 10.5px; font-weight: 600; font-family: 'Geist Mono', monospace; cursor: pointer;">#${r}</button>`;
}
function weeklyRefChip(A,recordId){
  const s=weeklySignalById(recordId);
  return s ? `<button onclick="App.openWeeklyDetail('${esc(recordId)}')" title="查看引用信号" style="display:inline-flex;align-items:center;justify-content:center;height:19px;padding:0 6px;border:1px solid ${A.accentBorder};border-radius:5px;background:${A.accentSoft};color:${A.accentBright};font-size:10px;font-weight:600;cursor:pointer;">引用</button>` : '';
}

// 原先 CSS `pointsSlide 56s` 走完一套卡片；能排进视口时不滚动、不复制。
const POINTS_LOOP_MS = 56000;

function pointsHalf(){
  const track = document.getElementById('pointsTrack');
  return track ? Math.max(1, track.scrollWidth / 2) : 1;
}

function pointsOverflows(){
  const viewport = document.getElementById('pointsViewport');
  const set = viewport && viewport.querySelector('.personal-set');
  if(!viewport || !set) return false;
  // 只量第一组卡片。set.scrollWidth 在双轨 flex 里会把复制组算进去，
  // 于是永远判定要滚动，居中 class 也就加不上。
  const cards = set.querySelectorAll('.personal-card');
  if(!cards.length) return false;
  const gap = parseFloat(getComputedStyle(set).gap) || 0;
  let width = 0;
  for(let i = 0; i < cards.length; i++) width += cards[i].getBoundingClientRect().width;
  width += gap * Math.max(0, cards.length - 1);
  return width > viewport.clientWidth + 1;
}

function syncPointsMarqueeMode(){
  const viewport = document.getElementById('pointsViewport');
  if(!viewport) return false;
  const need = pointsOverflows();
  viewport.classList.toggle('is-static', !need);
  if(!need){
    state.pointsShift = 0;
    const track = document.getElementById('pointsTrack');
    if(track) track.style.transform = '';
  }
  return need;
}

function applyPointsShift(){
  if(!syncPointsMarqueeMode()) return;
  const track = document.getElementById('pointsTrack');
  if(!track) return;
  const half = pointsHalf();
  state.pointsShift = ((state.pointsShift % half) + half) % half;
  track.style.transform = `translateX(${-state.pointsShift}px)`;
  const thumb = document.getElementById('pointsThumb');
  const bar = document.getElementById('pointsBar');
  if(thumb && bar){
    const max = Math.max(1, bar.clientWidth - thumb.offsetWidth);
    thumb.style.left = `${(state.pointsShift / half) * max}px`;
  }
}

function bindPointsMarquee(){
  const viewport = document.getElementById('pointsViewport');
  const bar = document.getElementById('pointsBar');
  if(!viewport || !document.getElementById('pointsTrack')) return;
  applyPointsShift();
  requestAnimationFrame(() => applyPointsShift());

  const drag = (startX, startShift, fromBar) => {
    if(!pointsOverflows()) return;
    state.pointsPaused = true;
    viewport.classList.add('is-drag');
    let moved = 0;
    const onMove = (ev) => {
      moved = ev.clientX - startX;
      const half = pointsHalf();
      if(fromBar){
        const thumb = document.getElementById('pointsThumb');
        const max = Math.max(1, bar.clientWidth - (thumb ? thumb.offsetWidth : 42));
        state.pointsShift = startShift + (moved / max) * half;
      } else {
        state.pointsShift = startShift - moved;
      }
      applyPointsShift();
    };
    const onUp = (ev) => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      viewport.classList.remove('is-drag');
      if(Math.abs(moved) > 6) state.pointsSkipClick = true;
      setTimeout(() => { state.pointsPaused = false; }, 900);
    };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  };

  viewport.addEventListener('pointerdown', (e) => {
    if(e.button !== 0) return;
    if(e.target.closest('.points-bar')) return;
    drag(e.clientX, state.pointsShift, false);
  });
  viewport.addEventListener('click', (e) => {
    if(state.pointsSkipClick){ e.preventDefault(); e.stopPropagation(); state.pointsSkipClick = false; }
  }, true);
  viewport.addEventListener('mouseenter', () => { state.pointsPaused = true; });
  viewport.addEventListener('mouseleave', () => { if(!viewport.classList.contains('is-drag')) state.pointsPaused = false; });

  if(bar){
    bar.addEventListener('pointerdown', (e) => {
      if(e.button !== 0) return;
      e.preventDefault();
      const thumb = document.getElementById('pointsThumb');
      const rect = bar.getBoundingClientRect();
      const max = Math.max(1, bar.clientWidth - (thumb ? thumb.offsetWidth : 42));
      const x = e.clientX - rect.left - ((thumb ? thumb.offsetWidth : 42) / 2);
      state.pointsShift = (Math.max(0, Math.min(max, x)) / max) * pointsHalf();
      applyPointsShift();
      drag(e.clientX, state.pointsShift, true);
    });
  }

  if(!window._pointsRaf){
    const tick = (now) => {
      const last = tick._t || now;
      const dt = Math.min(48, now - last);
      tick._t = now;
      if(!state.pointsPaused && pointsOverflows() && document.getElementById('pointsTrack')){
        state.pointsShift += pointsHalf() * dt / POINTS_LOOP_MS;
        applyPointsShift();
      }
      window._pointsRaf = requestAnimationFrame(tick);
    };
    window._pointsRaf = requestAnimationFrame(tick);
  }
}
